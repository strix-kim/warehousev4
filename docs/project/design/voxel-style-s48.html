<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Воксельный мир ARGO</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Manrope:wght@600;700;800&subset=cyrillic,latin&display=swap">
<style>
/* =========================================================
   0. Токены — дословно из redesign-s31.html. 3D читает их же через getComputedStyle.
   ========================================================= */
:root{
  color-scheme: light;
  --bg:#EEF0F3; --grid:rgba(22,24,29,.055);
  --card:#FFFFFF; --sunk:#F5F6F8; --hover:#F0F2F5; --select:#E9ECF1;
  --ink:#16181D; --ink-2:#2A2E36; --muted:#5F6470; --faint:#676C77; --soft:#8A8F9A;
  --line:#DDE0E5; --line-2:#E8EAEE; --ctl:#858A95;
  --red:#E52D27; --red-act:#C8201B; --red-press:#AE1B16; --red-tint:#FCEAE9;
  --night:#0F1115; --night-2:#1A1D23; --night-3:#262A31; --night-line:#2C3038;
  --on-night:#E8EAEE; --on-night-2:#9CA1AC; --red-night:#FF5A52; --bad-night:#FF8095;
  --ok:#1B7A45; --ok-bg:#E3F3EA; --ok-dot:#2A9D5C;
  --warn:#8A5A00; --warn-bg:#FBF0D5; --warn-dot:#B7800A;
  --bad:#B0203F; --bad-bg:#FBE6EA; --bad-dot:#B0203F;
  --focus:#16181D;
  --r-xl:22px; --r-lg:18px; --r-md:12px; --r-sm:8px;
  --f-display:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --shadow-pop:0 18px 48px rgba(15,17,21,.16),0 2px 6px rgba(15,17,21,.06);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.vh{position:absolute!important;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Кнопки и госномер — из s31 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:11px;border:1px solid transparent;font:600 14px/1 var(--f-text);white-space:nowrap;transition:background-color .12s,border-color .12s,transform .12s var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn--ink{background:var(--ink);color:#fff}
.btn--ink:hover{background:#000}
.btn--secondary{background:var(--card);border-color:var(--ctl);color:var(--ink)}
.btn--secondary:hover{background:var(--hover)}
.plate{width:max-content;display:inline-flex;align-items:stretch;height:30px;border:2px solid var(--ink);border-radius:6px;background:#fff;font:600 16px/1 var(--f-mono);color:var(--ink);letter-spacing:.02em;overflow:hidden;white-space:nowrap}
.plate b{display:grid;place-items:center;padding:0 7px;border-right:2px solid var(--ink);font-weight:600}
.plate span{display:grid;place-items:center;padding:0 9px}
.plate i{display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:3px 5px 2px;font:700 7px/1 var(--f-text);font-style:normal}
.plate i::before{content:"";display:block;width:14px;height:9px;background:linear-gradient(#1EB5E6 0 33%,#fff 33% 38%,#E52D27 38% 42%,#fff 42% 58%,#E52D27 58% 62%,#fff 62% 67%,#1EB53A 67%);border:.5px solid #cfd3d9}
.plate--lg{height:44px;font-size:24px;border-radius:8px;border-width:2.5px}
.plate--lg b{border-right-width:2.5px;padding:0 10px}
.plate--lg span{padding:0 12px}
.plate--lg i{font-size:9px;padding:5px 8px 4px}
.plate--lg i::before{width:20px;height:13px}

/* =========================================================
   1. Оболочка приложения — из redesign-s31: сайдбар, контент, нижние вкладки.
      Второй вариант (body.nav-top) — та же навигация узкой полосой сверху.
   ========================================================= */
html,body{height:100%}
body{overflow:hidden}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
body.nav-top .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
body.nav-top .u-side,body:not(.nav-top) .u-topbar,.p-tabs{display:none}

/* Сайдбар — дословно s31; знак — ArgoDots, как в продукте */
.u-side{background:var(--night);color:var(--on-night);display:flex;flex-direction:column;padding:22px 14px 16px;gap:4px;min-height:0;position:relative;overflow:hidden}
.u-side::after{content:"";position:absolute;left:-40px;right:-40px;bottom:0;height:260px;background:radial-gradient(ellipse 60% 80% at 20% 100%,rgba(229,45,39,.16),transparent 70%);pointer-events:none}
.u-brand{display:flex;align-items:center;gap:12px;color:var(--on-night)}
.u-brand svg{width:40px;height:24px;display:block;flex:none}
.u-brand small{font:600 11px/1 var(--f-text);letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-2)}
.u-side .u-brand{padding:4px 10px 22px}
.u-side__group{font:600 11px/1 var(--f-text);letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-2);padding:18px 12px 8px}
.u-nav{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--on-night);font:500 14px/1 var(--f-text);position:relative;text-align:left;white-space:nowrap}
.u-nav svg{color:var(--on-night-2)}
.u-nav:hover{background:var(--night-2)}
.u-nav.is-on{background:var(--night-3);font-weight:600}
.u-nav.is-on svg{color:#fff}
.u-nav.is-on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.u-nav em{margin-left:auto;font:600 12px/1 var(--f-text);font-style:normal;color:var(--on-night-2)}
.u-side__new{margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--night-line);background:rgba(255,255,255,.02);color:var(--on-night);text-align:left}
.u-side__new span.plus{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--red-act);color:#fff}
.u-side__new b{display:block;font:600 14px/1.2 var(--f-text)}
.u-side__new small{display:block;font:400 12px/1.3 var(--f-text);color:var(--on-night-2)}
.u-side__foot{margin-top:auto;display:grid;gap:10px;position:relative;z-index:1}
.u-loc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--night-line);font:600 13px/1 var(--f-text)}
.u-loc svg{color:var(--on-night-2)}
.u-lang{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;border:1px solid var(--night-line)}
.u-lang button{min-height:32px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:var(--on-night-2);font:700 12px/1 var(--f-text);letter-spacing:.06em}
.u-lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.u-user{display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid var(--night-line)}
.u-ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#3A3F48;color:#fff;font:700 12px/1 var(--f-text);flex:none}
.u-user b{display:block;font:600 13px/1.2 var(--f-text)}
.u-user small{display:block;font:400 12px/1.2 var(--f-text);color:var(--on-night-2)}
.u-out{margin-left:auto;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--on-night-2);display:grid;place-items:center}
.u-out:hover{background:var(--night-2);color:var(--on-night)}

/* Верхняя полоса: тот же хром лентой 56 px. Шапка страницы под ней — без своего фона,
   иначе две полосы хрома подряд. */
.u-topbar{display:flex;align-items:center;gap:20px;padding:0 14px 0 22px;background:var(--night);color:var(--on-night);min-width:0}
.u-topbar nav{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.u-topbar nav::-webkit-scrollbar{display:none}
.u-topbar .u-nav{min-height:36px;padding:0 11px;gap:8px;font-size:13.5px}
.u-topbar .u-nav.is-on::before{left:11px;right:11px;top:auto;bottom:-10px;width:auto;height:3px;border-radius:3px 3px 0 0}
.u-top-end{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.u-topbar .u-lang{width:84px}
.u-topbar .u-lang button{min-height:28px}

/* Контент */
.u-main{min-width:0;min-height:0;display:flex;flex-direction:column;padding:26px 32px 28px}
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.u-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px;flex-wrap:wrap}
.u-eyebrow{font:600 11.5px/1 var(--f-text);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.u-h1{font:800 32px/1.08 var(--f-display);letter-spacing:-.035em;display:flex;align-items:center;gap:12px}
.u-sub{margin-top:8px;color:var(--muted);font-size:14px}
.u-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.count{display:inline-grid;place-items:center;min-width:28px;height:26px;padding:0 8px;border-radius:999px;background:var(--select);color:var(--ink);font:700 13px/1 var(--f-text);letter-spacing:0;font-variant-numeric:tabular-nums}
.btn--primary{background:var(--red-act);color:#fff}
.btn--primary:hover{background:var(--red-press)}
.btn--sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.field{display:flex;align-items:center;gap:10px;min-height:40px;width:260px;padding:0 12px;border:1px solid var(--ctl);border-radius:11px;background:var(--card);color:var(--faint)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:400 14px/1 var(--f-text)}
.field input::placeholder{color:var(--faint)}
.field:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.ev{display:flex;align-items:center;gap:10px}
/* Тумблер дня мероприятия: выкл — дорожка --ctl, вкл — чёрная */
.switch{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:0 12px 0 8px;border:0;border-radius:11px;background:transparent;font:600 14px/1 var(--f-text);color:var(--ink);white-space:nowrap}
.switch:hover{background:var(--hover)}
.switch .trk{position:relative;flex:none;width:40px;height:24px;border-radius:999px;background:var(--ctl);transition:background-color .18s var(--ease-out)}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(15,17,21,.25);transition:transform .18s var(--ease-out)}
.switch[aria-checked="true"] .trk{background:var(--night)}
.switch[aria-checked="true"] .trk::after{transform:translateX(16px)}
.today{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font:600 13px/1 var(--f-text);white-space:nowrap}
.today::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok-dot)}

/* Сцена — один renderer на всё приложение: узел переезжает между слотами страниц */
.slot{flex:1;min-height:0;display:grid}
.stage{position:relative;min-height:0;overflow:hidden;background:var(--stage-bg,var(--bg));border:1px solid var(--line);border-radius:var(--r-lg)}
/* Стенд облика: тёмная палитра — рамка и подпись сцены в тон сайдбару; таблички остаются белыми карточками */
.stage.is-dark{border-color:var(--night-line)}
.stage.is-dark .cap b{color:var(--on-night)}
.stage.is-dark .cap span{color:var(--on-night)}
.stage.is-dark .chip[aria-pressed="true"],.stage.is-dark .ptag.is-sel em{background:var(--night-3);border-color:var(--on-night-2)}
.scene{position:absolute;inset:0}
.scene:focus-visible{outline-offset:-3px}
.scene canvas{display:block;touch-action:none}
.scene.is-pick canvas{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cap{position:absolute;left:16px;top:14px;display:grid;gap:2px;pointer-events:none}
.cap b{font:800 18px/1.15 var(--f-display);letter-spacing:-.02em}
.cap span{font:500 12.5px/1.3 var(--f-text);color:var(--muted)}
.stage-btn{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.92)}
/* Полёт в гараж и обратно: таблички, подпись и нижний ряд гаснут, в конце — шторка цвета фона поверх canvas.
   Шторку ведёт JS покадрово, остальное — CSS-переходы по классам. */
.curtain{position:absolute;inset:0;z-index:5;background:var(--stage-bg,var(--bg));opacity:0;pointer-events:none}
.labels,.cap,.dock,.stage-btn{transition:opacity .21s var(--ease-out)}
.stage.is-flying .labels,.stage.is-flying .cap,.stage.is-flying .dock,.stage.is-flying .stage-btn{opacity:0;pointer-events:none}
.page .u-head,.panel,.g-list{transition:opacity .245s var(--ease-out),transform .245s var(--ease-out)}
.page.is-in .u-head,.page.is-out .u-head{opacity:0}
.page.is-in .panel,.page.is-in .g-list,.page.is-out .panel,.page.is-out .g-list{opacity:0;transform:translateX(24px)}

/* Нижний ряд сцены — клавиатурный и текстовый путь к каждому объекту */
.dock{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:safe center;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:600 14px/1 var(--f-text);color:var(--ink);box-shadow:0 1px 2px rgba(15,17,21,.05)}
.chip:hover{border-color:var(--ctl)}
.chip--plate{font:600 13.5px/1 var(--f-mono);letter-spacing:.02em}
.chip-m{font:700 13.5px/1 var(--f-display);letter-spacing:-.01em}
.chip[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff}
.toast{position:fixed;left:50%;bottom:28px;z-index:80;transform:translate(-50%,8px);opacity:0;padding:10px 16px;border-radius:12px;background:var(--night);color:var(--on-night);font:500 14px/1.3 var(--f-text);white-space:nowrap;pointer-events:none;transition:opacity .18s,transform .18s var(--ease-out)}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

/* Главная: откат без 3D — плитки s31 с числами home_summary */
.home-list{display:grid;gap:14px;align-content:start}
.home-list__bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;color:var(--muted);font:500 14px/1.3 var(--f-text)}
.p-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.p-tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px;min-height:150px;align-content:space-between;justify-items:start;text-align:left;color:var(--ink)}
.p-tile:hover{border-color:var(--ctl)}
.p-tile svg.i{width:22px;height:22px}
.p-tile b{font:800 30px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.p-tile span{font:600 14px/1.2 var(--f-text)}
.p-tile small{color:var(--faint);font-size:12.5px;display:block;margin-top:4px}
.p-tile small.warn{color:var(--warn)}
.p-tile--dark{background:var(--ink);border-color:var(--ink);color:#fff}
.p-tile--dark:hover{border-color:var(--ink)}
.p-tile--dark small{color:var(--on-night-2)}
.p-tile--wide{grid-column:span 2;min-height:0;grid-template-columns:1fr auto;align-items:center;justify-items:stretch}
.hallsdots{display:flex;gap:5px}
.hallsdots i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:700 11px/1 var(--f-text);font-style:normal;color:#fff;background:var(--c)}
.page-home.is-list .slot,.no-gl .slot{display:none!important}

/* Стенд — только макет: облик мира (форма, цвет, насыщенность) и вариант навигации одной панелью.
   Кнопка «Облик» сворачивает панель; на телефоне панель свёрнута и раскрывается листом снизу. */
.mock{position:fixed;right:16px;bottom:16px;z-index:90;display:grid;justify-items:end;gap:8px}
.mock__toggle{order:2;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow-pop);font:600 13px/1 var(--f-text);color:var(--ink)}
.mock__toggle::after{content:"";width:7px;height:7px;border-right:1.9px solid currentColor;border-bottom:1.9px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.mock.is-shut .mock__toggle::after{transform:translateY(2px) rotate(-135deg)}
.mock__body{display:grid;gap:8px;min-width:432px;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-pop)}
.mock.is-shut .mock__body{display:none}
.mock-row{display:grid;gap:5px;font:600 11px/1 var(--f-text);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mock-row>span{padding-left:4px}
.mock-row div{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);padding:2px;gap:2px;border-radius:10px;background:var(--sunk)}
.mock-row button{min-height:40px;padding:0 9px;border:0;border-radius:8px;background:transparent;font:600 12.5px/1.15 var(--f-text);letter-spacing:0;text-transform:none;color:var(--muted);white-space:nowrap}
.mock-row button[aria-pressed="true"]{background:var(--night);color:#fff}
.mock__done{display:none}

/* Таблички CSS2D. Слой не ловит мышь — всё решает raycast по 3D. */
.tag{pointer-events:none;display:grid;gap:1px;padding:7px 11px 8px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:0 2px 8px rgba(15,17,21,.06);white-space:nowrap;transition:border-color .12s,box-shadow .12s}
.tag b{font:700 13px/1.2 var(--f-display);letter-spacing:-.01em;color:var(--ink)}
.tag b i{font-style:normal}
.tag span{font:500 12px/1.3 var(--f-text);color:var(--muted);font-variant-numeric:tabular-nums}
.tag.is-hot{border-color:var(--ink);box-shadow:var(--shadow-pop)}
/* Карточка события над выездом. Анимируем ВНУТРЕННИЙ блок: transform внешнего пишет CSS2DRenderer каждый кадр. */
.evcard{pointer-events:none;margin-bottom:12px}
.evcard>div{display:grid;gap:4px;padding:12px 16px 13px;border-radius:14px;background:var(--card);box-shadow:var(--shadow-pop);white-space:nowrap;animation:evpop .4s var(--ease-out)}
.evcard b{font:800 16px/1.15 var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.evcard .where{font:500 13px/1.3 var(--f-text);color:var(--ink-2)}
.evcard .st{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1.2 var(--f-text);color:var(--ok)}
.evcard .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok-dot)}
.evcard small{font:500 12px/1.3 var(--f-text);color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes evpop{from{opacity:0;transform:translateY(8px) scale(.96)}}
/* Подпись машины: модель строкой + госномер знаком с флагом «UZ» — тот же .plate, что в карточке, в размере подписи. */
.ptag{pointer-events:none;display:grid;justify-items:center;gap:3px;margin-bottom:8px;white-space:nowrap}
.ptag em{padding:2px 7px 3px;border:1px solid var(--line);border-radius:6px;background:var(--card);font:700 13px/1.2 var(--f-display);font-style:normal;letter-spacing:-.01em;color:var(--ink);transition:background-color .12s,border-color .12s,color .12s}
.ptag .plate{height:24px;border-width:1.5px;border-radius:5px;font-size:13px}
.ptag .plate b{padding:0 5px;border-right-width:1.5px}
.ptag .plate span{padding:0 6px}
.ptag .plate i{padding:2px 4px 1px;font-size:6px}
.ptag .plate i::before{width:12px;height:8px}
.ptag.is-hot em{border-color:var(--ink)}
.ptag.is-sel em{background:var(--night);border-color:var(--night);color:#fff}

/* =========================================================
   2. Автомобили: сцена слева, справа карточка выбранной + реестр строками.

   ========================================================= */
.garage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);gap:16px}
.garage>.slot{grid-row:1/3}
.garage.is-flat>.slot{display:none}
.garage.is-flat .g-list{grid-column:1;grid-row:1/3}
.panel{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.p-head{padding:18px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;border-bottom:1px solid var(--line-2)}
.p-photo{width:56px;height:56px;border-radius:14px;background:var(--sunk);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--muted);font-size:24px}
.p-name{font:800 22px/1.1 var(--f-display);letter-spacing:-.025em}
.p-role{color:var(--muted);margin-top:4px;font-size:14px}
.p-plate{margin-top:12px}
.p-close{display:none}
.p-body{padding:8px 20px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;min-height:40px;border-bottom:1px solid var(--line-2);margin:0}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--faint);font-size:13px}
.kv dd{margin:0;font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px}

.sw{width:16px;height:16px;border-radius:5px;border:1px solid var(--line);flex:none}
.p-foot{padding:12px 20px 14px;border-top:1px solid var(--line-2);display:flex;gap:8px}
.p-foot .btn{flex:1}
.p-empty{display:grid;justify-items:center;gap:6px;padding:26px 24px;text-align:center}
.p-empty .p-photo{border-style:dashed;margin-bottom:6px}
.p-empty h3{font-size:18px;font-weight:800}
.p-empty p{color:var(--muted);font-size:14px}
.p-empty kbd{font:600 12px/1 var(--f-mono);padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--sunk)}

/* Реестр строками — текстовый путь к каждой машине */
.g-list{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}

.g-rows{flex:1;min-height:0;overflow:auto;position:relative}
.car-row{width:100%;min-height:58px;border:0;border-bottom:1px solid var(--line-2);background:transparent;text-align:left;color:var(--ink);position:relative}

.garage.is-flat .c-drv,.garage.is-flat .c-files{display:block}
.garage.is-flat .c-name small{display:none}
.g-list__head span{font:inherit;color:inherit}
.g-none{padding:22px 16px;color:var(--muted);font-size:14px}

  .panel{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:72svh;overflow:auto;border-radius:var(--r-xl) var(--r-xl) 0 0;border-bottom:0;box-shadow:var(--shadow-pop)}

  .p-head,.p-body{padding-inline:18px}

  .p-foot{padding:12px 18px 22px}
  .kv{grid-template-columns:110px minmax(0,1fr)}

  .ptag:not(.is-hot):not(.is-sel){opacity:0}

  .p-tab[aria-current="page"]{color:var(--ink);background:var(--select)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

  const put = (geo, m, edge) => {
    const key = m.uuid + (edge ? edge.uuid : '');
    if (!buckets.has(key)) buckets.set(key, { m, edge, list: [] });
    let g = geo.clone().applyMatrix4(_mx);
    // RoundedBoxGeometry без индекса; mergeGeometries сливает только однородные — приводим всё к неиндексированному
    if (SH.round && g.index) { const n = g.toNonIndexed(); g.dispose(); g = n; }
    buckets.get(key).list.push(g);
  };
  const k = (m, w, h, d, x, y0, z, edge, rx = 0, rr) => {
    const r = radiusOf(w, h, d, rr);
    if (r && y0 < 0.001 && !rx && h > 2 * r) { h += r; y0 -= r; }
    _p.set(x, y0 + h / 2, z); _q.setFromAxisAngle(AX, rx);
    if (r) { _mx.compose(_p, _q, _s.set(1, 1, 1)); put(rbox(w, h, d, r), m, edge); }
    else { _mx.compose(_p, _q, _s.set(w, h, d)); put(BOX, m, edge); }
    if (SH.ink && !m.userData.ground) crease(ink, w, h, d, r, _p, _q);
  };
  k.cyl = (m, r, w, x, y, z) => {
    _mx.compose(_p.set(x, y, z), _q.setFromAxisAngle(AZ, Math.PI / 2), _s.set(r, w, r));
    put(WHEEL, m);
  };
  k.slab = (m, w, h, d, x, y0, z, edge) => {
    const R = SH.round ? Math.min(SH.ratio * Math.min(w, d), SH.cap) : 0, H = Math.max(h, 2 * R);
    if (R < 0.03 || H === h) return k(m, w, h, d, x, y0, z, edge);
    _mx.compose(_p.set(x, y0 + h / 2, z), Q0, _s.set(1, h / H, 1));
    put(rbox(w, H, d, R), m, edge);
    if (SH.ink) crease(ink, w, H, d, R, _p, null, h / H);
  };
  k.post = (m, w, h, d, x, y0, z, edge) => {
    if (!SH.toy || Math.max(w, d) > 2 * Math.min(w, d)) return k(m, w, h, d, x, y0, z, edge);
    const r = Math.max(w, d) * 0.56;
    _mx.compose(_p.set(x, y0 + h / 2, z), Q0, _s.set(r, h, r));
    put(WHEEL, m);
  };
  k.drum = (m, w, h, d, x, y0, z) => {
    _mx.compose(_p.set(x, y0 + h / 2, z), Q0, _s.set(w / 2, h, d / 2));
    put(DRUM, m);
  };
  k.dome = (m, w, h, d, x, y0, z) => {
    _mx.compose(_p.set(x, y0 + h / 2, z), Q0, _s.set(w / 2, h / 2, d / 2));
    put(DOME, m);
  };
  // Проём на стене, обращённой к +z: ноги-прямоугольник + полукруг радиусом в половину ширины
  k.door = (m, w, h, d, x, y0, z) => {
    if (!SH.toy) return k(m, w, h, d, x, y0, z);
    k(m, w, h - w / 2, d, x, y0, z);
    _mx.compose(_p.set(x, y0 + h - w / 2, z), _q.setFromAxisAngle(AX, Math.PI / 2), _s.set(w / 2, d, w / 2));
    put(HALF, m);
  };
  // Свод: половина овального цилиндра осью по x — длина w, высота h, глубина d; y0 — пята свода
  k.vault = (m, w, h, d, x, y0, z) => {
    _q.setFromAxisAngle(AY, Math.PI / 2).multiply(_q2.setFromAxisAngle(AX, Math.PI / 2));
    _mx.compose(_p.set(x, y0, z), _q, _s.set(d / 2, w, h));
    put(HALF, m);
  };
  k.wrap = (m, w, h, d, x, y0, z) => {
    _mx.compose(_p.set(x, y0 + h / 2, z), Q0, _s.set(w / 2 + 0.04, h, d / 2 + 0.04));
    put(WRAP, m);
  };
  k.into = (parent) => {
    for (const { m, edge, list } of buckets.values()) {
      const geo = mergeGeometries(list);
      list.forEach((g) => g.dispose());
      const mesh = new THREE.Mesh(geo, m);
      // Тонкие рёбра --line — только у острых кубов: у скруглённых форм грань читается светом, у «Контура» — чернилами
      if (edge && !SH.round) mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edge));
      parent.add(mesh);
      if (SH.ink && !m.userData.ground) hull(mesh);
    }
    if (ink.length) parent.add(new THREE.LineSegments(lineGeo(ink), INK));
    buckets.clear();
    ink.length = 0;
  };
  return k;
}

// Табличка CSS2D: якорь — нижний центр элемента
function label(parent, html, cls, x, y, z) {
  const el = document.createElement('div');
  el.className = cls;
  el.innerHTML = html;
  const o = new CSS2DObject(el);
  o.position.set(x, y, z);
  o.center.set(0.5, 1);
  parent.add(o);
  return o;
}

// Диорама, а не макет района: ОФИС — эталон габаритов (≈12×10, высота 7,6, дверь 2,9),
// остальные здания — игрушки того же калибра: склад ≤ 1,5 офиса, гараж шириной с офис. Фигурка (2,0) ≈ 2/3 двери — нарочито крупная, машины ей под стать.
// Здание — 8–20 объёмов, окна — 1–3 широкие ленты --select, рёбра — только у основных объёмов.
// Дерево-игрушка: куб-ствол + одна-две крупные кроны. «Галька» и «Контур» — крона сильно скруглена,
// «Игрушка» — ствол-цилиндр и кроны-эллипсоиды (ствол на 0,4 выше: уходит в крону, иначе она касается его точкой).
function tree(k, x, z, s = 1) {
  k.post(DARK, 0.5 * s, 1.6 * s + (SH.toy ? 0.4 : 0), 0.5 * s, x, 0, z);
  const crown = (w, h, d, cx, y0, cz) => SH.toy ? k.dome(LEAF, w, h, d, cx, y0, cz) : k(LEAF, w, h, d, cx, y0, cz, EDGE, 0, SH.round ? 0.3 * Math.min(w, h, d) : undefined);
  crown(2.6 * s, 2.2 * s, 2.6 * s, x, 1.6 * s, z);
  if (s > 1) crown(1.5, 1.2, 1.5, x + 0.2, 1.6 * s + 2.2 * s - (SH.toy ? 0.25 : 0), z - 0.1);
}
// Кейс — один графитовый куб
const crate = (k, x, y0, z, s = 0.7) => k(DARK, s, s, s, x, y0, z);

// Здание: группа с собственным материалом корпуса (его чуть подсвечивает полёт в гараж).
// ring — кольцо на земле вокруг основания: центр (cx, cz) в мире, радиус = половина диагонали + запас.
function building(id, x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const body = own(P.wall);
  g.userData = { id, mats: [body] };
  roots[id] = g;
  // roofMass — крыша-объём: в палитрах, где она цвета стены, это тот же материал корпуса (один меш, общие рёбра)
  return { g, body, roofMass: P.roofMass === P.wall ? body : mat(P.roofMass), edge: EDGE, k: kit() };
}

/* ============== Здания: у каждого свой силуэт и свой «жест» ============== */
// Офис: Г-образный план, второй этаж консолью над входом, угол — стеклянный атриум
function buildOffice() {
  const [X, Z] = POS.office, { g, body, edge, k } = building('office', X, Z);
  k(body, 4.5, 7, 6, -3.75, 0, -1.5, edge);                 // западное крыло, 2 этажа
  k(body, 7.5, 3.5, 5, 2.25, 0, 1.5, edge);                 // южное крыло, первый этаж
  k(body, 7.5, 3.5, 6.5, 2.25, 3.5, 2.25, edge);            // второй этаж — консоль наружу
  k.slab(ROOF, 4.7, 0.3, 6.2, -3.75, 7, -1.5);              // крыша крыла
  k(GLASS, 4.5, 7.6, 3, -3.75, 0, 3, EDGE);                 // атриум во всю высоту
  k(BAND, 6.6, 1.3, 0.1, 2.25, 4.6, 5.52);                  // лента окон консоли
  k(BAND, 0.1, 1.3, 4.4, -6.02, 4.6, -1.8);                 // лента окон крыла
  k.door(DOOR, 2.8, 2.9, 0.14, 2.25, 0, 4.02);              // вход — крупный проём
  // Вывеска ARGO на торце консоли: графит + три крупных красных кубика
  k(SIGN, 4.4, 1.5, 0.2, 2.25, 4.9, 5.66);
  for (const dx of [-1.1, 0, 1.1]) k(SIGN_MARK, 0.7, 0.7, 0.3, 2.25 + dx, 5.3, 5.8);
  // Флаг у входа — крупнее «настоящего»
  k.post(DARK, 0.3, 7.5, 0.3, 7.2, 0, 6.2);
  k(RED, 2.2, 1.4, 0.12, 8.35, 5.9, 6.2);
  tree(k, -7.8, 5.6, 1.1);
  k.into(g);
  g.userData.top = 7.6;
  g.userData.ring = [X, Z + 0.5, Math.hypot(12, 10) / 2 + 1.2];
  return g;
}

// Склад: ангар с пилой из 3 зубьев, башня-офис с торца чуть выше офиса, рампа с навесом.
// Длина 17 = 1,4 офиса.
function buildWarehouse() {
  const [X, Z] = POS.warehouse, { g, body, roofMass, edge, k } = building('warehouse', X, Z);
  // ангар: x −8,5…4,5. «Игрушка»: радиус меньше общего — над ним свод с прямыми углами в плане
  k(body, 13, 4.5, 9, -2, 0, 0, edge, 0, SH.toy ? 0.4 : undefined);
  if (SH.toy) k.vault(roofMass, 13, 2, 9, -2, 4.5, 0);       // бочкообразный свод той же высоты, что пила
  else for (let t = 0; t < 3; t++) {
    const a = -8.5 + t * (13 / 3);
    k(roofMass, 2.9, 1, 9, a + 2.85, 4.5, 0, edge);          // зуб: две ступени
    k(roofMass, 1.45, 1, 9, a + 3.6, 5.5, 0, edge);
  }
  // башня: 8,6 против 7,6 у офиса. «Игрушка»: овальный цилиндр в тех же габаритах, лента окон — по дуге
  if (SH.toy) {
    k.drum(body, 4, 8.6, 5.5, 6.5, 0, -1.75);
    k.drum(ROOF, 4.2, 0.4, 5.7, 6.5, 8.6, -1.75);
    k.wrap(BAND, 4, 1.2, 5.5, 6.5, 6, -1.75);
  } else {
    k(body, 4, 8.6, 5.5, 6.5, 0, -1.75, edge);
    k.slab(ROOF, 4.2, 0.4, 5.7, 6.5, 8.6, -1.75);
    k(BAND, 0.1, 1.2, 4.4, 8.52, 6, -1.75);                  // лента окон башни
  }
  k(BAND, 4.6, 0.9, 0.1, 1.6, 2.6, 4.52);                    // лента окон ангара
  k.door(DOOR, 3.6, 3.2, 0.14, -4, 0.9, 4.52);               // ворота у рампы
  k(WHITE, 5, 0.9, 2, -4, 0, 5.5, EDGE);                     // рампа
  k.slab(CANOPY, 6, 0.3, 2.6, -4, 4.2, 5.8, EDGE);           // навес
  for (const x of [-6.6, -1.4]) k.post(DARK, 0.35, 4.2, 0.35, x, 0, 6.9);
  crate(k, -5, 0.9, 5.3); crate(k, -4.2, 0.9, 5.9);
  k.into(g);
  g.userData.top = 9.4;
  g.userData.ring = [X, Z + 0.5, Math.hypot(17, 11) / 2 + 1];
  return g;
}

// Гараж: коробка шириной с офис, 3 проёма, односкатная крыша ступенями, мезонин.
// В проёмах три машины передками, остальные три — на площадке перед ним; все — теми же моделями, что в гараже.
const [GX, GZ] = POS.garage;          // позиция гаража в мире
const bayX = (b) => -3.8 + b * 3.8;   // локальный x проёма
function buildGarage() {
  const { g, body, roofMass, edge, k } = building('garage', GX, GZ);
  k(body, 12, 4, 7, 0, 0, 0, edge);
  if (SH.toy) for (let b = 0; b < 3; b++) k.door(DOOR, 3.3, 3, 0.1, bayX(b), 0, 3.52);   // три арочных проёма вместо ленты
  else {
    k(DOOR, 11.4, 3, 0.1, 0, 0, 3.52);                       // проёмы — одна тёмная лента
    for (const x of [-1.9, 1.9]) k(body, 0.5, 3, 0.3, x, 0, 3.6);   // простенки
  }
  k.slab(roofMass, 12.2, 0.5, 4.5, 0, 4, -1.25, edge);       // односкат: две ступени к задней стене
  k.slab(roofMass, 12.2, 0.5, 2, 0, 4.5, -2.5, edge);
  k(body, 4.5, 2, 3, 3, 5, -1.9, edge);                      // мезонин
  k(BAND, 3.6, 0.9, 0.1, 3, 5.6, -0.38);
  k(SIGN, 3.6, 1.1, 0.2, -2.5, 4.5, 0.6);                    // вывеска
  for (const dx of [-0.6, 0.4]) k(SIGN_MARK, 0.55, 0.55, 0.2, -2.5 + dx, 4.8, 0.75);
  k(mat(P.pad), 12, 0.03, 5, 0, 0, 6);                       // площадка перед гаражом
  k.into(g);
  // Те же модели, что внутри: в проёмах торчат передки (остальное прячет коробка), двое — на площадке
  [0, 2, 3].forEach((ci, b) => { const v = makeCar(CARS[ci]); v.position.set(bayX(b), 0, 4.7 - SPEC[CARS[ci].kind].l / 2); g.add(v); });
  [4, 5].forEach((ci, b) => { const v = makeCar(CARS[ci]); v.position.set(bayX(b), 0, 6.6); g.add(v); });
  g.userData.top = 7;
  g.userData.ring = [GX, GZ + 1, Math.hypot(12, 9) / 2 + 1];
  return g;
}

// Выезд: дорога уходит за край сетки, у неё столбик-указатель со стрелкой. Есть всегда;
// кликабелен и кнопкой в нижнем ряду — только в день мероприятия (над ним карточка события).
const EXIT = POS.exit;
function buildExit() {
  const { g, k } = building('exit', EXIT[0], EXIT[1]);
  k.post(DARK, 0.3, 3.4, 0.3, 0, 0, 0);
  k(WHITE, 2.4, 1.1, 0.16, 0.6, 2.2, 0.1, EDGE);              // табличка
  k(RED, 1.1, 0.28, 0.2, 0.45, 2.62, 0.2);                    // стрелка → к краю: древко и наконечник
  k(RED, 0.4, 0.62, 0.2, 1.2, 2.45, 0.2);
  k(STEEL, 1.2, 0.5, 0.5, -0.9, 0, 0.6);                      // бетонный блок у обочины
  k.into(g);
  g.userData.top = 3.4;
  g.userData.ring = [EXIT[0] + 0.3, EXIT[1] + 0.2, 1.7];
  return g;
}

/* ============== Машины: силуэт по модели из 11–16 объёмов. Перёд — +z. ==============
   Сборка — дословно из docs/project/design/voxel-cars-spec.md: все числа в долях собственной длины машины,
   длина L — в у. е. (Cobalt = 1), одна у. е. = U м сцены. Деталь: [роль, ш, в, д, x, y центра, z, наклон по x в °].
   Роли: body — цвет машины (с рёбрами), glass — тёмный салон уже кузова, dark — графит (кладдинг, решётка, рама),
   lamp — фары --warn-bg, red — фонари. Колесо: [диаметр, ширина, x центра, z оси], ставится парой ±x.
   Наклонные стёкла — клином slope() по координатам силуэта из текста спецификации (в таблицах они тонкие
   пластины перед вертикальной стенкой салона — с камеры силуэт оставался коробкой).
   Отступления от таблиц спецификации — комментарием у модели. */
const U = 4.5;   // длина Cobalt в сцене: под неё рассчитаны шаги раскладки гаража
// Наклонное стекло по силуэту из спецификации: верхняя плоскость клина идёт от (zLow, yLow) у капота/багажника
// до (zHigh, yHigh) у крыши. Толщина клина — 1,6 высоты прямоугольного треугольника под стеклом: он закрывает пустоту
// между стеклом, поясом и салоном (с запасом — иначе в перспективе у пояса видны щели), лишнее уходит внутрь кузова. Перёд ниже — наклон положительный.
function slope(w, zLow, yLow, zHigh, yHigh) {
  const dz = Math.abs(zHigh - zLow), dy = yHigh - yLow, len = Math.hypot(dz, dy), t = (dz * dy / len) * 1.6;
  const a = Math.atan2(dy, dz) * Math.sign(zLow - zHigh), ny = Math.cos(a), nz = Math.sin(a);
  return ['glass', w, t, len, 0, (yLow + yHigh) / 2 - (t / 2) * ny, (zLow + zHigh) / 2 - (t / 2) * nz, THREE.MathUtils.radToDeg(a)];
}
const SPEC = {
  // Кроссовер: длинная прямая крыша до вертикального задка, светодиодная полоса во всю ширину, рейлинги.
  // Капот поднят на 0,01 над поясом (в таблице он внутри кузова и не виден).
  lynk: { L: 1.17, parts: [
    ['dark', 0.381, 0.07, 1.00, 0, 0.072, 0],             // нижний пояс-кладдинг
    ['body', 0.381, 0.105, 1.00, 0, 0.16, 0],
    ['body', 0.36, 0.02, 0.27, 0, 0.215, 0.365],          // капот
    ['glass', 0.36, 0.12, 0.56, 0, 0.272, -0.18],         // салон до почти вертикального заднего стекла
    slope(0.36, 0.23, 0.225, 0.10, 0.332),                // лобовое: +0,22 → +0,10 по силуэту
    ['body', 0.37, 0.012, 0.56, 0, 0.338, -0.18],         // крыша +0,10 → −0,46
    ['dark', 0.015, 0.012, 0.45, -0.15, 0.35, -0.14],     // рейлинги
    ['dark', 0.015, 0.012, 0.45, 0.15, 0.35, -0.14],
    ['lamp', 0.34, 0.012, 0.01, 0, 0.205, 0.505],         // полоса фар во всю ширину
    ['red', 0.34, 0.012, 0.01, 0, 0.205, -0.505],
    ['dark', 0.30, 0.05, 0.01, 0, 0.15, 0.505],           // «маска» под полосой
  ], wheels: [[0.149, 0.055, 0.175, 0.32], [0.149, 0.055, 0.175, -0.283]] },
  // Cab-over: кабина над передней осью без капота + бортовая платформа с тремя бортами и стенкой у кабины.
  // Стекло уже кабины (в таблице шире): по правилу «салон уже кузова».
  bongo: { L: 1.142, deck: 0.176, parts: [
    ['dark', 0.26, 0.05, 0.96, 0, 0.10, -0.02],           // рама
    ['body', 0.340, 0.12, 0.37, 0, 0.19, 0.315],          // кабина до пояса
    ['glass', 0.33, 0.11, 0.36, 0, 0.305, 0.315],
    ['body', 0.345, 0.03, 0.375, 0, 0.375, 0.315],        // крыша кабины
    ['dark', 0.340, 0.06, 0.02, 0, 0.16, 0.50],           // бампер с решёткой
    ['lamp', 0.30, 0.025, 0.01, 0, 0.21, 0.505],
    ['dark', 0.323, 0.02, 0.608, 0, 0.166, -0.19],        // пол платформы
    ['body', 0.012, 0.069, 0.608, -0.166, 0.21, -0.19],   // борта: левый, правый, задний
    ['body', 0.012, 0.069, 0.608, 0.166, 0.21, -0.19],
    ['body', 0.335, 0.069, 0.012, 0, 0.21, -0.494],
    ['body', 0.335, 0.069, 0.012, 0, 0.21, 0.114],        // передняя стенка платформы
    ['dark', 0.06, 0.07, 0.25, -0.15, 0.12, -0.05],       // бак под платформой
  ], wheels: [[0.128, 0.045, 0.15, 0.28], [0.110, 0.085, 0.135, -0.269]] },   // задние сдвоенные — один цилиндр двойной ширины
  // Седаны (правка ведущего с47): по таблицам спецификации салон выходил ~45 % длины и ~25 % высоты — плоская плита.
  // Пропорции по фото: пояс ≈ 0,55 высоты, стекло от пояса до крыши ≥ 0,36 высоты, салон с клиньями 0,50–0,58 L,
  // капот 0,28 L, ширина салона 0,9 кузова. Колёса выступают из кузова на 0,012.
  // Cobalt: трёхобъёмник, багажник-ступень 0,20 L выше капота.
  cobalt: { L: 1.0, parts: [
    ['body', 0.387, 0.151, 1.00, 0, 0.1105, 0],           // кузов до пояса 0,186
    ['body', 0.36, 0.015, 0.28, 0, 0.19, 0.36],           // капот +0,22 → +0,5

  nexia: { L: 1.0, parts: [

    ['body', 0.35, 0.015, 0.28, 0, 0.175, 0.36, 6],       // капот клином

    ['glass', 0.34, 0.129, 0.29, 0, 0.2365, -0.055],

  chazor: { L: 1.067, parts: [
    ['body', 0.384, 0.142, 1.00, 0, 0.101, 0],            // кузов до пояса 0,172
    ['body', 0.36, 0.015, 0.28, 0, 0.1775, 0.36],         // капот
    ['body', 0.37, 0.025, 0.14, 0, 0.1845, -0.43],        // палуба −0,36 → −0,5
    ['glass', 0.35, 0.129, 0.24, 0, 0.2365, -0.05],
    slope(0.35, 0.22, 0.185, 0.07, 0.301),                // лобовое +0,22 → +0,07
    slope(0.35, -0.36, 0.197, -0.17, 0.301),              // длинное пологое заднее −0,36 → −0,17
    ['body', 0.36, 0.012, 0.24, 0, 0.307, -0.05],         // крыша +0,07 → −0,17

// Габариты в метрах сцены — для кольца и рамки кадра: l — длина, w — ширина по внешним плоскостям колёс
for (const s of Object.values(SPEC)) {
  s.l = s.L * U;
  s.w = 2 * Math.max(...s.parts.map(([, w, , , x]) => Math.abs(x) + w / 2), ...s.wheels.map(([, w, x]) => x + w / 2)) * s.l;
}

const CAR_SINK = 0.07;   // на сколько (в долях длины) капот и багажник уходят в кузов в скруглённых формах
function makeCar(c, cargo = false) {
  const g = new THREE.Group(), k = kit(), s = SPEC[c.kind], n = s.l;
  // Цвет кузова — данные машины (CARS.hex), палитра его не трогает
  const role = { body: mat(c.hex), glass: CAR_GLASS, dark: DARK, lamp: HEADLAMP, red: RED };
  let top = 0;
  for (let [r, w, h, d, x, y, z, deg = 0] of s.parts) {
    top = Math.max(top, (y + h / 2) * n);
    const edge = r === 'body' ? EDGE : undefined, rx = THREE.MathUtils.degToRad(deg);
    // Скруглённые формы: тонкая панель кузова на скруглённом объёме висела бы козырьком. Крыша — плита со скруглёнными
    // в плане углами; капот и багажник утолщаются вниз, внутрь кузова, и скругляются вместе с ним.
    if (SH.round && r === 'body' && !deg && h < 0.05 && w > 0.2) {
      if (y > 0.28) { k.slab(role[r], w * n, h * n, d * n, x * n, (y - h / 2) * n, z * n, edge); continue; }
      y -= CAR_SINK / 2; h += CAR_SINK;
    }
    k(role[r], w * n, h * n, d * n, x * n, (y - h / 2) * n, z * n, edge, rx);
  }
  // Колесо — шина --night-3 и тонкий диск --ctl на внешней стороне; рёбер нет
  for (const [dia, w, x, z] of s.wheels) for (const sx of [-1, 1]) {
    const r = (dia / 2) * n;
    k.cyl(TIRE_MAT, r, w * n, sx * x * n, r, z * n);
    k.cyl(STEEL, r * 0.6, 0.006 * n, sx * (x + w / 2 + 0.002) * n, r, z * n);
  }
  if (cargo) { const y0 = s.deck * n; crate(k, -0.4, y0, -1.2); crate(k, 0.4, y0, -0.4); }   // кейсы на полу платформы
  k.into(g);
  g.userData = { top };
  return g;
}

/* ============== Кольцо на полу: одно на машины и здания ==============
   Наведение/фокус — тонкое серое (--ctl, 0,6) за 150 мс из scale g0 → 1.
   Выбор/активация — сплошной красный «пятак» (правка прораба с47): непрозрачный диск --red растёт от центра
   за 300 мс, по его краю красное кольцо того же цвета делает «бам»-пульс 0,8 → 1,08 → 1 за 350 мс и в покое
   сливается с диском — один круг чуть шире серого кольца наведения. Снятие — кольцо и диск схлопываются за 150 мс.
   Состояние кольца задают showRing/selectRing/hideRing, кадры считает tickRings; moveRing — перенос. */
const RINGS = [];
// Значение, плавно идущее к цели по --ease-out
const glide = (v, to, dur, now) => { if (v.to !== to) Object.assign(v, { from: v.val, to, t0: now, dur }); };
const glideStep = (v, now) => (v.val = v.from + (v.to - v.from) * easeOut(reduced || !v.dur ? 1 : Math.min(1, Math.max(0, (now - v.t0) / v.dur))));
function makeRing(parent, r, x, z, { half = 0.07, g0 = 0.85, y = 0.1 } = {}) {
  const flatMesh = (geo, color, opacity, dy, order) => {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, y + dy, z);
    m.renderOrder = order;
    m.visible = false;
    parent.add(m);
    return m;
  };
  const disc = (w, color) => flatMesh(new THREE.RingGeometry(r - w, r + w, 72), color, 0, 0, 2);
  // Заливка лежит на 5 мм выше кольца, но рисуется до него. Цвет один, поэтому шва нет: кольцо — край диска.
  // Непрозрачность 1, но transparent + depthWrite: false остаются — диск не z-файтит с полом
  const fill = flatMesh(new THREE.CircleGeometry(r, 72), P.ringSel, 1, 0.005, 1);
  const ring = { gray: disc(half, P.ringHover), red: disc(half * 1.9, P.ringSel), fill, g0, hovOn: false, h: { val: 0, from: 0, to: 0, t0: 0, dur: 0 }, f: { val: 0, from: 0, to: 0, t0: 0, dur: 0 }, selOn: false, sT0: -1e9, s0: 0 };
  RINGS.push(ring);
  return ring;
}
// Перенос кольца вслед за машиной (смена раскладки гаража)
const moveRing = (ring, x, z) => [ring.gray, ring.red, ring.fill].forEach((m) => { m.position.x = x; m.position.z = z; });
const showRing = (ring, on) => { if (ring) ring.hovOn = on; };
function selectRing(ring, on) {
  if (!ring || ring.selOn === on) return;
  ring.selOn = on;
  ring.sT0 = performance.now();
  ring.s0 = ring.red.visible ? ring.red.scale.x : 0;
}
// Мгновенно погасить — при смене сцены под шторкой
function hideRing(ring) {
  if (!ring) return;
  Object.assign(ring, { hovOn: false, selOn: false, s0: 0, sT0: -1e9 });
  Object.assign(ring.h, { val: 0, from: 0, to: 0, dur: 0 });
  Object.assign(ring.f, { val: 0, from: 0, to: 0, dur: 0 });
}
// Сразу в покое «выбрано» — после пересборки мира (смена облика), без повторного пульса
function settleRing(ring) {
  Object.assign(ring, { selOn: true, sT0: -1e9 });
  Object.assign(ring.f, { val: 1, from: 1, to: 1, dur: 0 });
}
// Пульс: 0,8 → 1,08 за 45 % времени, затем → 1
const pulse = (k) => k < 0.45 ? 0.8 + 0.28 * easeOut(k / 0.45) : 1.08 - 0.08 * easeOut((k - 0.45) / 0.55);
function tickRings(now) {
  for (const r of RINGS) {
    glide(r.h, r.hovOn && !r.selOn ? 1 : 0, 150, now);
    const p = glideStep(r.h, now);
    r.gray.visible = p > 0.001;
    r.gray.scale.setScalar(r.g0 + (1 - r.g0) * p);
    r.gray.material.opacity = 0.6 * p;
    if (r.selOn) {
      const k = reduced ? 1 : Math.min(1, Math.max(0, (now - r.sT0) / 350));
      r.red.visible = true;
      r.red.scale.setScalar(pulse(k));
      r.red.material.opacity = Math.min(1, k * 4);
    } else {
      const k = reduced ? 1 : Math.min(1, Math.max(0, (now - r.sT0) / 150)), s = r.s0 * (1 - easeOut(k));
      r.red.visible = s > 0.001;
      r.red.scale.setScalar(Math.max(s, 0.001));
    }
    // Диск: от центра к краю за 300 мс, обратно к центру за 150 мс; reduced — сразу конечное состояние
    glide(r.f, r.selOn ? 1 : 0, r.selOn ? 300 : 150, now);
    const f = glideStep(r.f, now);
    r.fill.visible = f > 0.001;
    r.fill.scale.setScalar(Math.max(f, 0.001));
  }
}

/* ============== Фигурки ============== */
const LEGS_CAP = new THREE.CapsuleGeometry(0.25, 0.3, 4, 12), BODY_CAP = new THREE.CapsuleGeometry(0.33, 0.09, 4, 12);
// Сотрудник-игрушка: ноги, тело, голова — три объёма. Ходьба — покачивание, без шарниров.
function makePerson(parent, x, z, rot, cloth, withCase) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  const inner = new THREE.Group();
  g.add(inner);
  const legs = mat(P.legs), skin = mat(P.skin);
  // Скруглённые формы: тело — капсула; «Игрушка» — ноги тоже капсула, голова — шар. Габариты те же.
  if (SH.toy) solid(inner, LEGS_CAP, legs, 0, 0.4, 0, 1, 1, 0.68);
  else box(inner, legs, 0.5, 0.8, 0.34, 0, 0, 0);
  if (SH.round) solid(inner, BODY_CAP, mat(cloth), 0, 1.175, 0, 1, 1, 0.64);
  else box(inner, mat(cloth), 0.66, 0.75, 0.42, 0, 0.8, 0, EDGE);
  if (SH.toy) solid(inner, DOME, skin, 0, 1.78, 0, 0.25, 0.25, 0.25);
  else box(inner, skin, 0.46, 0.46, 0.46, 0, 1.55, 0, EDGE);
  if (withCase) box(inner, DARK, 0.2, 0.5, 0.6, 0.48, 0.4, 0);
  g.userData = { inner };
  parent.add(g);
  return g;
}
function pose(p, t) {
  const a = Math.sin(t * 9), { inner } = p.userData;
  inner.position.y = Math.abs(a) * 0.1;
  inner.rotation.z = a * 0.07;
}
// Точка на ломаной по пройденному пути: позиция + направление
function along(pts, d) {
  for (let i = 1; i < pts.length; i++) {
    const [ax, az] = pts[i - 1], [bx, bz] = pts[i], len = Math.hypot(bx - ax, bz - az);
    if (d <= len || i === pts.length - 1) { const k = Math.min(1, d / len); return [ax + (bx - ax) * k, az + (bz - az) * k, Math.atan2(bx - ax, bz - az), d >= len]; }
    d -= len;
  }
}
const pathLen = (pts) => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);

/* ============== Мир кампуса ============== */
function ground(parent, size) {
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(size, size), flat(P.ground));
  plane.rotation.x = -Math.PI / 2;
  parent.add(plane);
  // Сетка шагом 1 м: цвет --ink с низкой непрозрачностью, как --grid в токенах
  const grid = new THREE.GridHelper(size, size, P.grid, P.grid);
  grid.material.transparent = true;
  grid.material.opacity = P.gridA;
  grid.material.depthWrite = false;
  grid.position.y = 0.06;
  parent.add(grid);
}

// Дорожки — короткие светлые полосы без бордюров; два толстых фонаря.
// Кампус по диагонали от камеры (правка прораба с47: с рабочего ракурса здания не перекрывают друг друга):
// гараж слева-спереди, офис по центру, склад справа-сзади. Главная дорога — вдоль фронта, от площадки гаража
// направо за край сетки (выезд); к ней от входа в офис и от рампы склада — по прямой полосе.
function roads(k) {
  const ROAD = flat(P.road), [OX, OZ] = POS.office, [WX, WZ] = POS.warehouse, r0 = ROAD_Z - 1.25;
  const rect = (x0, x1, z0, z1) => k(ROAD, x1 - x0, 0.04, z1 - z0, (x0 + x1) / 2, 0, (z0 + z1) / 2);
  rect(GX - 8, CAMPUS_HALF + 4, r0, r0 + 2.5);     // главная дорога: от гаража вдоль фронта за край сетки — выезд
  // Осевая пунктиром --ctl: без неё полотно --line на фоне --bg не читается как дорога
  for (let x = GX - 7; x < CAMPUS_HALF + 4; x += 2) k(flat(P.mark), 1, 0.05, 0.14, x + 0.5, 0, ROAD_Z);
  rect(WX - 5.25, WX - 2.75, WZ + 6.5, r0);        // от рампы склада к дороге
  rect(OX + 1.1, OX + 3.4, OZ + 4.1, r0);          // от входа в офис к дороге
  for (const [x, z] of [[OX + 5, r0 - 1.2], [WX - 6.6, WZ + 9]]) { k.post(DARK, 0.35, 3.6, 0.35, x, 0, z); SH.toy ? k.dome(GLASS, 0.9, 0.9, 0.9, x, 3.5, z) : k(GLASS, 0.9, 0.7, 0.9, x, 3.6, z, EDGE); }
}

function buildCampus() {
  const g = new THREE.Group();
  ground(g, CAMPUS_HALF * 2);
  const k = kit();
  roads(k);
  k.into(g);
  for (const make of [buildOffice, buildWarehouse, buildGarage, buildExit]) g.add(make());
  // Название — «Склад · Оборудование»; на телефоне хвост после точки прячется, остаётся имя
  for (const s of SITES) labels[s.id] = label(roots[s.id], `<b>${s.name}<i> · ${s.title.split(' · ')[1]}</i></b><span>${s.sub}</span>`, 'tag', 0, roots[s.id].userData.top + 1.2, 0);
  // Кольца зданий лежат в группе кампуса, а не в здании: гараж при полёте растёт, кольцо — нет
  for (const id of CAMPUS_IDS) {
    const [x, z, r] = roots[id].userData.ring;
    roots[id].userData.ring = makeRing(g, r, x, z, { half: 0.16, g0: 0.9, y: 0.08 });
  }
  labels.event = label(roots.exit, `<div><b>Bionorica Workshop</b><span class="where">Double Tree by HILTON · 12.10</span><span class="st">идёт</span><small>32 позиции · Jupiter&amp;Uranus</small></div>`, 'evcard', 0, roots.exit.userData.top + 0.6, 0);
  labels.event.visible = false;

  // Bongo 3 стоит на площадке перед гаражом носом к дороге
  const van = makeCar(CARS[VAN], true);
  g.add(van);
  // Люди: трое ходят — по полосам от склада и от офиса и вдоль главной дороги, шестеро стоят,
  // четверо с кейсами — бригада у рампы склада
  const [OX, OZ] = POS.office, [WX, WZ] = POS.warehouse, side = ROAD_Z - 1.7;   // side — обочина главной дороги
  const walkers = [
    [[WX - 4.6, WZ + 8], [WX - 4.6, side], 0], [[OX + 1.7, OZ + 5], [OX + 1.7, side], 4], [[GX + 7, side], [OX - 3, side], 2],
  ].map(([a, b, ph], i) => ({ p: makePerson(g, a[0], a[1], 0, P.cloth[i % 3]), pts: [a, b], ph }));
  [[OX + 4.2, OZ + 6.6, 2.6], [OX + 5, OZ + 7.1, -1.8], [WX + 10, WZ + 2.5, 1.2], [WX + 10.8, WZ + 3.2, -2.3], [GX - 7.4, GZ + 7.8, 0.4], [OX - 6, OZ + 9, 2.8]]
    .forEach(([x, z, r], i) => makePerson(g, x, z, r, P.cloth[(i + 1) % 3]));
  // Бригада: от рампы склада по полосе к главной дороге и вдоль неё к выезду, встаёт у указателя
  const lane = WX - 4, walk = EXIT[1] + 1;   // ось полосы от склада; тропа вдоль дороги перед указателем
  const crew = [[-6, 8.4], [-4.9, 8.6], [-3.8, 8.4], [-2.7, 8.6]].map(([dx, dz], i) => {
    const h = [WX + dx, WZ + dz], [fx, fz] = [[-3.6, 0.6], [-2.5, 0.3], [-1.4, 0.6], [-2.5, -0.7]][i], fin = [EXIT[0] + fx, EXIT[1] + fz];
    return { p: makePerson(g, h[0], h[1], 0.3, P.cloth[i % 3], true), pts: [h, [lane, h[1] + 0.8], [lane, walk], [fin[0] - 1.5, walk], fin], home: h };
  });
  W.life = { van, walkers, crew };
  return g;
}

const CAMPUS_IDS = ['office', 'warehouse', 'garage', 'exit'];

// Интерьер гаража — та же миниатюра: крупные объёмы, немного, но «есть чем жить». ≤ 60 объёмов без машин.
// Раскладка — под пропорции окна сцены (правка прораба с47): широкое окно (aspect ≥ 1,5) — один ряд из 6,
// иначе — два ряда по 3, передний сдвинут на полшага, чтобы задние машины читались в просветах.
// Коробка (стены, разметка, стеллаж) собрана на обе раскладки заранее — переключается видимостью.
// hw — полуширина, zb — задняя стена, zf — передний край пола, fd — глубина рамки места.
const STEP = 4.4, LIFT = 5;   // BYD стоит на подъёмнике
const ROW_GAP = 5.6;          // шаг рядов: ~5 по брифу + запас под Bongo длиной 5,1
const LAYOUTS = {
  row: { hw: 14.2, zb: -5.5, zf: 4.5, fd: 6, slots: CARS.map((_, i) => [(i - 2.5) * STEP, 0]) },
  grid: {
    hw: 9.8, zb: -7.4, zf: 6.6, fd: ROW_GAP - 0.2,
    slots: CARS.map((_, i) => i < 3 ? [(i - 1) * STEP - STEP / 4, -ROW_GAP / 2] : [(i - 4) * STEP + STEP / 4, ROW_GAP / 2]),
  },

const layoutFor = (aspect) => aspect >= 1.5 ? 'row' : 'grid';   // Full HD и шире — ряд; сайдбар, 1366, телефон — два ряда

function garageShell(L) {
  const g = new THREE.Group(), { hw, zb, zf, fd } = L, zc = (zb + zf) / 2, d = zf - zb;

  k(flat(P.floor), 2 * hw, 0.04, d, 0, 0, zc);

  k(wall, 2 * hw + 0.3, 4.5, 0.3, 0, 0, zb, EDGE);
  k(DARK, 2 * hw + 0.3, 0.4, 0.34, 0, 0, zb);
  for (const [z0, z1] of [[zb, zc - 2], [zc + 2, zf]]) k(wall, 0.3, 4.5, z1 - z0, -hw, 0, (z0 + z1) / 2, EDGE);
  k(wall, 0.3, 4.5, d, hw, 0, zc, EDGE);

  for (const [x, z] of L.slots) for (const sd of [-1, 1]) {
    k(PAINT, 0.12, 0.08, fd, x + sd * STEP / 2, 0, z);
    k(PAINT, STEP + 0.12, 0.08, 0.12, x, 0, z + sd * fd / 2);
  }

  const rz = zb + 0.7;
  for (const dx of [4.8, 9.6]) k(STEEL, 0.16, 3.2, 1, -hw + dx, 0, rz);
  for (const y of [0.3, 1.35, 2.4]) k(WHITE, 5, 0.12, 1, -hw + 7.2, y, rz, EDGE);
  for (const [dx, y, sz, m] of [[5.7, 0.42, 0.9, DARK], [6.9, 0.42, 0.8, WHITE], [6, 1.47, 0.8, WHITE], [8.6, 1.47, 0.85, RED], [7.6, 2.52, 0.9, DARK]])
    k(m, sz, sz, sz * 0.9, -hw + dx, y, rz, m === WHITE ? EDGE : undefined);

  k(LAMP, 4, 1.6, 0.08, 3, 1.9, zb + 0.19, EDGE);
  for (const [x, h] of [[1.8, 0.9], [2.6, 1.2], [3.4, 0.7], [4.2, 1]]) k(DARK, 0.14, h, 0.06, x, 2.15, zb + 0.26);
  k(DARK, 3.4, 0.16, 1.2, 3, 1, zb + 0.9);

}
const TIRE = new THREE.CylinderGeometry(0.6, 0.6, 0.3, 14);

// Раскладка без анимации: машины и их кольца перескакивают на места, коробка меняется видимостью

/* ============== 3D: мир, камера, цикл ============== */
function hasGL() {
  try { return !!(window.WebGL2RenderingContext && document.createElement('canvas').getContext('webgl2')); }
  catch { return false; }

// Камера по виду: направление и пределы зума. Цель и дистанцию считает viewPose
// по «рамке интереса» под текущий аспект. Направление — углом от вертикали (polar) и поворотом

// Гараж (правка прораба с47): камера справа-спереди и низко — машины в три четверти, виден бок и перед.

// Рамка интереса — набор точек, которые обязаны попасть в кадр: углы габаритов каждого объекта
// (не общий бокс — у него пустые углы над землёй съедают кадр) + точка над крышей под табличку.
// Кампус: три здания, выезд и край сетки на дороге. Гараж: машины на местах текущей раскладки + 1 м запаса.
let campusPts = null;

function framePoints(view) {
  if (view === 'campus') {
    if (!campusPts) campusPts = CAMPUS_IDS.flatMap((id) => {
      const b = new THREE.Box3().setFromObject(roots[id]), c = b.getCenter(new THREE.Vector3());
      return [...corners(b), c.setY(b.max.y + 3.5)];
    }).concat([new THREE.Vector3(CAMPUS_HALF + 1, 0, ROAD_Z + 1.25)]);   // + край сетки на дороге: видно, как фургон уходит
    return campusPts;
  }
  return LAYOUTS[state.layout].slots.flatMap(([x, z], i) => {
    const s = SPEC[CARS[i].kind], top = roots['car' + i].userData.top;
    const b = new THREE.Box3(new THREE.Vector3(x - s.w / 2 - 1, 0, z - s.l / 2 - 1), new THREE.Vector3(x + s.w / 2 + 1, top, z + s.l / 2 + 1));

function initWorld() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  sceneEl.appendChild(renderer.domElement);
  const css2d = new CSS2DRenderer();
  css2d.domElement.className = 'labels';
  sceneEl.appendChild(css2d.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(T.bg);   // цвет земли палитры ставит applyStyle()
  // Туман цвета фона включён всегда, но вынесен за горизонт: полёт лишь сдвигает near/far.
  // Включать/выключать его нельзя — смена fog пересобирает шейдеры и даёт рывок в начале полёта.
  scene.fog = new THREE.Fog(T.bg, 1e4, 1e4 + 1);
  // Свет: заливка + один направленный, теней нет — схема, а не «как в жизни»
  scene.add(new THREE.AmbientLight(0xffffff, 2));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(0.5, 1, 0.25);
  scene.add(sun);

  const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 600);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = !reduced;
  controls.dampingFactor = 0.08;
  controls.enablePan = true;
  controls.minPolarAngle = 0.25;          // не в зенит
  controls.maxPolarAngle = 1.38;          // не под землю
  controls.addEventListener('start', () => { state.userMoved = true; });

  W = { renderer, css2d, scene, camera, controls, elapsed: 0, anim: null };
  buildWorld();
  setLayout('row');
  homeLife();

  new ResizeObserver(() => { fit(); if (!state.userMoved && !state.flying) placeCamera(); }).observe(sceneEl);

  bindPointer();
  const timer = new THREE.Timer();   // Clock в r186 устарел
  const bounds = new THREE.Vector3(), shift = new THREE.Vector3();
  renderer.setAnimationLoop((now) => {
    timer.update(now);
    const dt = Math.min(timer.getDelta(), 0.1);
    if (W.anim) {
      // Полёт: камерой правит анимация, OrbitControls выключены и не обновляются
      const a = W.anim, k = Math.min(1, Math.max(0, (now - a.t0) / a.dur));
      a.step(k, easeOut(k));
      if (k >= 1) { W.anim = null; a.done(); }
    } else {
      controls.update();
      // Сдвиг камеры не уводит цель за пределы сцены
      const t = controls.target;
      bounds.set(THREE.MathUtils.clamp(t.x, -30, 30), THREE.MathUtils.clamp(t.y, 0, 14), THREE.MathUtils.clamp(t.z, -30, 30));
      shift.subVectors(bounds, t);
      if (shift.lengthSq() > 0) { t.add(shift); camera.position.add(shift); }
    }
    W.elapsed = timer.getElapsed();
    tickLife(W.elapsed, dt, now);
    tickRings(now);
    if (W.garage.visible) tickGarage(now);
    renderer.render(scene, camera);
    css2d.render(scene, camera);
  });
}

// Обе сцены в текущем облике: материалы из палитры → кампус и гараж → списки кликабельного
function buildWorld() {
  applyStyle();
  W.campus = buildCampus();
  W.garage = buildGarageView();
  W.scene.add(W.campus, W.garage);
  // Кликабельное — только меши объектов; рёбра, контур, кольца и земля в raycast не идут
  const collect = (ids, list) => ids.forEach((id) => roots[id].traverse((o) => { if (o.isMesh && !o.userData.hull) { o.userData.root = id; list.push(o); } }));
  collect(CAMPUS_IDS, pickables.campus);
  collect(CARS.map((_, i) => 'car' + i), pickables.garage);
}
// Смена облика без перезагрузки: старую сборку снести и освободить, собрать заново; вид, раскладка гаража,
// выбранная машина, день мероприятия и положение камеры остаются как были.
function restyle() {
  if (!W) return applyStyle();   // без WebGL — только рамка сцены
  const { layout, hover, sel } = state;
  for (const o of Object.values(labels)) o.element.remove();
  for (const g of [W.campus, W.garage]) {
    W.scene.remove(g);
    g.traverse((o) => { o.geometry?.dispose(); o.material?.dispose(); });
  }
  for (const cache of [GEO, MATS, FLATS]) { cache.forEach((v) => v.dispose()); cache.clear(); }
  for (const dict of [roots, labels]) for (const key of Object.keys(dict)) delete dict[key];
  pickables.campus.length = pickables.garage.length = RINGS.length = 0;
  campusPts = null;
  state.layout = null;
  buildWorld();
  W.campus.visible = state.view === 'campus';
  W.garage.visible = state.view === 'garage';
  setLayout(layout);
  if (state.event) {
    for (const s of SITES) if (s.ev) labels[s.id].element.querySelector('span').textContent = s.ev;
    labels.event.visible = true;
  } else homeLife();
  if (hover) paint(hover);
  if (sel != null) {
    const v = roots['car' + sel];
    paint('car' + sel);
    settleRing(v.userData.ring);
    Object.assign(v.userData.lift, { val: 0.15, from: 0.15, to: 0.15 });
  }
}

// Размер canvas — синхронно: при смене страницы сцена переезжает в другой слот, а полёту нужен новый аспект сразу
function fit() {
  const w = sceneEl.clientWidth, h = sceneEl.clientHeight;
  if (!W || !w || !h) return false;
  W.renderer.setSize(w, h);
  W.css2d.setSize(w, h);
  W.camera.aspect = w / h;
  W.camera.updateProjectionMatrix();
  HULL_PX.value.set(2 * HULL_WIDTH / w, 2 * HULL_WIDTH / h);
  // Раскладку гаража решает окно гаража: на кампусе (другой слот) её не трогаем
  if (state.view === 'garage') setLayout(layoutFor(w / h));
  return true;
}

// Рабочий ракурс вида: направление задано, дистанция — минимальная, при которой все точки рамки
// попадают в кадр и по ширине, и по высоте (с учётом fov и aspect), плюс 5 % запаса.
// Для точки (rel = точка − цель) в осях камеры: глубина = dist − rel·dir, нужно |rel·right| ≤ tanH·глубина
// и |rel·up| ≤ tanV·глубина → dist ≥ rel·dir + |rel·right|/tanH и ≥ rel·dir + |rel·up|/tanV.
// Цель дважды сдвигаем к центру проекции — иначе перспектива оставляет пустую полосу с одного края.
const _dir = new THREE.Vector3(), _right = new THREE.Vector3(), _up = new THREE.Vector3(), _rel = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
function viewPose(view) {

    for (const q of pts) {

      dist = Math.max(dist, f + Math.abs(_rel.dot(_right)) / tanH, f + Math.abs(_rel.dot(_up)) / tanV);
    }

    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;

function placeCamera() {
  if (!W) return;
  const c = CAM[state.view], { camera, controls } = W, v = viewPose(state.view);
  controls.target.copy(v.t);
  camera.position.copy(v.p);
  controls.minDistance = c.min;
  controls.maxDistance = Math.max(c.max, v.dist * 1.3);

/* ============== Жизнь кампуса: фургон, бригада, прохожие, появление сцены ============== */
// Маршрут Bongo: с площадки гаража на главную дорогу → к выезду → за край сетки, где тает (масштаб → 0).
// Через паузу появляется из-за края, едет к гаражу и задом встаёт на площадку.
const HOME = [GX + bayX(2), GZ + 6.9];   // Bongo стоит на площадке перед правым проёмом
const GONE = CAMPUS_HALF + 2.5, FADE = 4.5;  // фургон тает на последних FADE м: от 2 м до края сетки до 2,5 м за ним
const OUT = [HOME, [HOME[0], ROAD_Z], [GONE, ROAD_Z]];
const BACK = [[GONE, ROAD_Z], [HOME[0], ROAD_Z], HOME];
const OUT_LEN = pathLen(OUT), BACK_LEN = pathLen(BACK), LEG_LAST = pathLen(BACK.slice(-2));
const CYCLE = 14.5, DRIVE = 5, AWAY = 3;           // 5 с туда, 3 с «на площадке», 5 с обратно, 1,5 с в гараже
let vanYaw = 0;

const bz = (s, a, b) => 3 * a * s * (1 - s) ** 2 + 3 * b * s * s * (1 - s) + s ** 3;
function easeOut(t) {
  let lo = 0, hi = 1, s = t;
  for (let i = 0; i < 18; i++) { s = (lo + hi) / 2; if (bz(s, 0.2, 0.2) < t) lo = s; else hi = s; }
  return bz(s, 0.8, 1);
}

function homeLife() {
  const { van, crew } = W.life;
  van.position.set(HOME[0], 0, HOME[1]);
  van.rotation.y = vanYaw = 0;
  van.scale.setScalar(1);
  van.visible = true;
  crew.forEach((c) => { c.p.position.set(c.home[0], 0, c.home[1]); c.p.rotation.y = 0.3; pose(c.p, 0); });
}

function tickLife(time, dt, now) {
  const { van, walkers, crew } = W.life;
  // Прохожие ходят туда-обратно всегда
  for (const w of walkers) {
    if (reduced) break;
    const L = pathLen(w.pts), d = ((time * 1.3 + w.ph) % (2 * L));
    const [x, z, yaw] = d < L ? along(w.pts, d) : along(w.pts.slice().reverse(), d - L);
    w.p.position.set(x, 0, z); w.p.rotation.y = yaw; pose(w.p, time + w.ph);
  }
  if (!state.event) return;
  const t = time - W.evT0;
  // Бригада идёт к выезду с кейсами и остаётся
  crew.forEach((c, i) => {
    const d = reduced ? 1e3 : Math.max(0, t - i * 0.4) * 4;
    const [x, z, yaw, done] = along(c.pts, d);
    c.p.position.set(x, 0, z);
    c.p.rotation.y = done ? Math.PI / 2 : yaw;   // лицом к выезду
    pose(c.p, done ? 0 : time);
  });

  let pos, rev = false;
  // reduced motion: фургон просто стоит у выезда
  if (reduced) pos = [EXIT[0] + 2, ROAD_Z, Math.PI / 2];
  else {
    const c = t % CYCLE;
    if (c < DRIVE) pos = along(OUT, (c / DRIVE) * OUT_LEN);
    else if (c < DRIVE + AWAY) pos = along(OUT, OUT_LEN);
    else if (c < 2 * DRIVE + AWAY) {
      const d = ((c - DRIVE - AWAY) / DRIVE) * BACK_LEN;
      pos = along(BACK, d);
      rev = d > BACK_LEN - LEG_LAST;   // последний отрезок — задом на площадку
    } else pos = [HOME[0], HOME[1], 0];
  }
  const [x, z, dir] = pos;
  van.position.set(x, 0, z);
  // За краем сетки фургон тает: масштаб 1 → 0 на последних FADE м
  const fade = clamp01((GONE - x) / FADE);
  van.scale.setScalar(Math.max(fade, 0.001));
  van.visible = fade > 0.001;
  const want = rev ? dir + Math.PI : dir;
  let d = Math.atan2(Math.sin(want - vanYaw), Math.cos(want - vanYaw));   // кратчайший поворот
  vanYaw += reduced ? d : d * Math.min(1, dt * 7);
  van.rotation.y = vanYaw;
}

/* ============== Наведение, выбор, клавиатура ============== */
const ndc = new THREE.Vector2(), ray = new THREE.Raycaster();
function pickAt(ev) {

  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, W.camera);
  // raycast не смотрит на visible: сцену без мероприятия отсекаем руками
  const hit = ray.intersectObjects(pickables[state.view], false).find((h) => h.object.userData.root !== 'exit' || state.event);
  return hit ? hit.object.userData.root : null;
}
function bindPointer() {
  const el = W.renderer.domElement;
  let down = null;
  el.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' && !e.buttons && !state.flying) setHover(pickAt(e)); });
  el.addEventListener('pointerleave', () => setHover(null));
  el.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
  el.addEventListener('pointerup', (e) => {
    if (state.flying || !down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;   // поворот, не клик
    const id = pickAt(e);
    if (id) activate(id);
    else if (state.view === 'garage') select(null);
  });
}

function nameOf(id) {
  if (id.startsWith('car')) { const c = CARS[+id.slice(3)]; return `${c.brand} ${c.model} · ${c.plate}`; }
  return NAMES[id];
}

// Наведение и выбор показывает только кольцо на полу и табличка; корпус и рёбра не меняются
function paint(id) {
  const r = roots[id];
  if (!r) return;
  const hot = state.hover === id;
  const sel = id === 'car' + state.sel;
  showRing(r.userData.ring, hot);
  if (id.startsWith('car')) selectRing(r.userData.ring, sel);
  const el = labels[id]?.element;
  if (el) { el.classList.toggle('is-hot', hot); el.classList.toggle('is-sel', sel); }
}

function setHover(id) {
  if (state.hover === id) return;
  const prev = state.hover;
  state.hover = id;
  if (prev) paint(prev);
  if (id) paint(id);
  sceneEl.classList.toggle('is-pick', !!id);
  if (id) $('hoverLive').textContent = nameOf(id);
}

let toastTimer;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('is-on'), 2400);
}

// Активация здания: кольцо краснеет с пульсом, круг заливается; у гаража из этого состояния стартует полёт,
// у остальных — тост, и кольцо гаснет через 600 мс
let ringTimer;
function activate(id) {
  if (state.flying) return;
  if (id.startsWith('car')) return select(+id.slice(3));
  const ring = roots[id]?.userData.ring;
  if (W && state.view === 'campus') {
    clearTimeout(ringTimer);
    for (const s of CAMPUS_IDS) if (s !== id) selectRing(roots[s].userData.ring, false);
    selectRing(ring, true);
  }
  if (id === 'garage') return go('garage');
  toast(`${nameOf(id)} — в макете не раскрыт`);
  if (ring) ringTimer = setTimeout(() => selectRing(ring, false), 600);
}

function select(i) {
  const prev = state.sel;
  state.sel = i;
  if (prev != null) paint('car' + prev);
  if (i != null) paint('car' + i);
  dock.querySelectorAll('[data-id]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === 'car' + i)));
  carList.querySelectorAll('[data-car]').forEach((r) => r.setAttribute('aria-selected', String(+r.dataset.car === i)));
  if (i != null) revealRow(i);
  renderPanel();
}

/* ============== Полёт в гараж и обратно ==============
   Туда: камера кампуса 630 мс летит к проёмам гаража, гараж чуть растёт, остальное уходит в туман цвета фона,
   последние 175 мс — шторка. Под шторкой — смена страницы и сцены; камера интерьера стартует ближе и ниже
   и за 350 мс доезжает до рабочего ракурса, справа въезжает панель (245 мс). Обратно — то же в обратном порядке.
   Темп — 0,7 от первой версии (правка прораба с47), easing тот же. */
const curtain = $('curtain');
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const anim = (dur, step) => new Promise((done) => { W.anim = { t0: performance.now(), dur, step, done }; });
// Камера и цель — от текущих к pose по уже посчитанному easing
function camTo(pose) {
  const { camera, controls } = W, p0 = camera.position.clone(), t0 = controls.target.clone();
  return (e) => { camera.position.lerpVectors(p0, pose.p, e); controls.target.lerpVectors(t0, pose.t, e); camera.lookAt(controls.target); };
}
const setCam = (pose) => { W.camera.position.copy(pose.p); W.controls.target.copy(pose.t); W.camera.lookAt(pose.t); };
// Точка максимального приближения: над площадкой, лицом к среднему проёму (ниже — камера режет машины на площадке)
const GFRONT = new THREE.Vector3(GX, 1.8, GZ + 3.6);
const garageClose = () => ({ t: GFRONT.clone(), p: GFRONT.clone().add(new THREE.Vector3(1.5, 6, 11)) });
// e = 0 — обычный кампус, 1 — гараж крупно, остальное в тумане
function campusFx(e) {
  const g = roots.garage, d = W.camera.position.distanceTo(GFRONT);
  g.scale.setScalar(1 + 0.05 * e);
  g.userData.mats[0].emissive?.setScalar(0.06 * e);   // у плоской заливки «Контура» свечения нет
  W.scene.fog.near = e ? d + lerp(150, 5, e) : 1e4;
  W.scene.fog.far = e ? d + lerp(300, 22, e) : 1e4 + 1;
}
const canFly = () => W && !reduced && !$('page-home').classList.contains('is-list');
function go(view) {
  if (state.flying || view === state.view) return;
  if (!canFly()) return setView(view);
  view === 'garage' ? enterGarage() : leaveGarage();
}
function flyStart() {
  state.flying = true;
  setHover(null);
  W.controls.enabled = false;
  stageEl.classList.add('is-flying');
}
function flyEnd() {
  curtain.style.opacity = 0;
  stageEl.classList.remove('is-flying');
  W.controls.enabled = true;
  state.flying = false;
}
async function enterGarage() {
  flyStart();
  $('page-home').classList.add('is-out');
  // Красное кольцо «бамкает» параллельно старту полёта: без отдельной паузы вход укладывается в 1 с
  const cam = camTo(garageClose());
  await anim(630, (k, e) => { cam(e); campusFx(e); curtain.style.opacity = clamp01((k - 0.72) / 0.28); });
  // Под шторкой: страница «Автомобили», интерьер; кампус возвращаем в обычный вид
  $('page-home').classList.remove('is-out');
  hideRing(roots.garage.userData.ring);
  campusFx(0);
  setView('garage', true);
  stageEl.classList.remove('is-flying');
  if (!sceneEl.clientWidth) return flyEnd();          // 3D свёрнуто — только панель
  const work = viewPose('garage'), off = work.p.clone().sub(work.t).multiplyScalar(0.55);
  off.y *= 0.6;
  setCam({ t: work.t, p: work.t.clone().add(off) });
  const cam2 = camTo(work);
  await anim(350, (k, e) => { cam2(e); curtain.style.opacity = 1 - clamp01(k / 0.4); });
  flyEnd();
}
async function leaveGarage() {
  flyStart();
  $('page-vehicles').classList.add('is-out');
  if (sceneEl.clientWidth) {
    // Камера интерьера отъезжает назад и вверх, под конец — шторка
    const { camera, controls } = W, off = camera.position.clone().sub(controls.target).multiplyScalar(1.6);
    off.y *= 1.3;
    const cam = camTo({ t: controls.target.clone(), p: controls.target.clone().add(off) });
    await anim(315, (k, e) => { cam(e); curtain.style.opacity = clamp01((k - 0.45) / 0.55); });
  } else {
    curtain.style.opacity = 1;
    await anim(245, () => {});
  }
  $('page-vehicles').classList.remove('is-out');
  setView('campus', true);
  // Кампус открывается с камерой у гаража и возвращается к общему виду
  const work = viewPose('campus');
  setCam(garageClose());
  campusFx(1);
  const cam = camTo(work);
  await anim(630, (k, e) => {
    cam(e);
    campusFx(1 - e);
    curtain.style.opacity = 1 - clamp01(k / 0.28);
    if (k > 0.6) stageEl.classList.remove('is-flying');
  });
  campusFx(0);
  flyEnd();
}
$('backBtn').addEventListener('click', () => go('campus'));
// Стрелки при фокусе в сцене гаража листают машины; Esc снимает выбор
sceneEl.addEventListener('keydown', (e) => {
  if (state.view !== 'garage') return;
  const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (d) {
    e.preventDefault();
    select(state.sel == null ? (d > 0 ? 0 : CARS.length - 1) : (state.sel + d + CARS.length) % CARS.length);
    $('hoverLive').textContent = nameOf('car' + state.sel);
  } else if (e.key === 'Escape') select(null);
});

setNav(store.get('mock-nav') === 'top' ? 'top' : 'side');
setFlat(store.get('mock-garage-flat') === '1', false);
if (hasGL()) {
  initWorld();
  if (reduced) setHomeList(true);   // без движения — плитки по умолчанию, мир по кнопке
} else {
  // Без WebGL: главная — плитки, машины — реестр. Кнопки возврата в мир прячем.
  document.body.classList.add('no-gl');
  applyStyle();
  $('listNote').textContent = '3D недоступно на этом устройстве — разделы списком';
  $('toWorld').hidden = flatBtn.hidden = true;
  setHomeList(true);
  setFlat(true, false);   // вынужденный режим не запоминаем
}
// Для проверок: число мешей, позиция фургона, камера, проекция габаритов (__THREE). Прямой вход ?debug или #debug.
if (location.hash === '#debug' || new URLSearchParams(location.search).has('debug')) Object.assign(window, { __world: W, __state: state, __THREE: THREE, __style: style, __setStyle: setStyle });
// Прямое открытие «Автомобилей» (#vehicles) — без полёта
setView(location.hash === '#vehicles' ? 'garage' : 'campus');
</script>
</body>
</html>
