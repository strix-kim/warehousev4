<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Воксельный мир ARGO</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Manrope:wght@600;700;800&subset=cyrillic,latin&display=swap">
<style>
/* =========================================================
   0. Токены — дословно из redesign-s31.html. 3D читает их же через getComputedStyle.
   ========================================================= */
:root{
  color-scheme: light;
  --bg:#EEF0F3; --grid:rgba(22,24,29,.055);
  --card:#FFFFFF; --sunk:#F5F6F8; --hover:#F0F2F5; --select:#E9ECF1;
  --ink:#16181D; --ink-2:#2A2E36; --muted:#5F6470; --faint:#676C77; --soft:#8A8F9A;
  --line:#DDE0E5; --line-2:#E8EAEE; --ctl:#858A95;
  --red:#E52D27; --red-act:#C8201B; --red-press:#AE1B16; --red-tint:#FCEAE9;
  --night:#0F1115; --night-2:#1A1D23; --night-3:#262A31; --night-line:#2C3038;
  --on-night:#E8EAEE; --on-night-2:#9CA1AC; --red-night:#FF5A52; --bad-night:#FF8095;
  --ok:#1B7A45; --ok-bg:#E3F3EA; --ok-dot:#2A9D5C;
  --warn:#8A5A00; --warn-bg:#FBF0D5; --warn-dot:#B7800A;
  --bad:#B0203F; --bad-bg:#FBE6EA; --bad-dot:#B0203F;
  --focus:#16181D;
  --r-xl:22px; --r-lg:18px; --r-md:12px; --r-sm:8px;
  --f-display:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --shadow-pop:0 18px 48px rgba(15,17,21,.16),0 2px 6px rgba(15,17,21,.06);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.vh{position:absolute!important;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Кнопки и госномер — из s31 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:11px;border:1px solid transparent;font:600 14px/1 var(--f-text);white-space:nowrap;transition:background-color .12s,border-color .12s,transform .12s var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn--ink{background:var(--ink);color:#fff}
.btn--ink:hover{background:#000}
.btn--secondary{background:var(--card);border-color:var(--ctl);color:var(--ink)}
.btn--secondary:hover{background:var(--hover)}
.plate{width:max-content;display:inline-flex;align-items:stretch;height:30px;border:2px solid var(--ink);border-radius:6px;background:#fff;font:600 16px/1 var(--f-mono);color:var(--ink);letter-spacing:.02em;overflow:hidden;white-space:nowrap}
.plate b{display:grid;place-items:center;padding:0 7px;border-right:2px solid var(--ink);font-weight:600}
.plate span{display:grid;place-items:center;padding:0 9px}
.plate i{display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:3px 5px 2px;font:700 7px/1 var(--f-text);font-style:normal}
.plate i::before{content:"";display:block;width:14px;height:9px;background:linear-gradient(#1EB5E6 0 33%,#fff 33% 38%,#E52D27 38% 42%,#fff 42% 58%,#E52D27 58% 62%,#fff 62% 67%,#1EB53A 67%);border:.5px solid #cfd3d9}
.plate--lg{height:44px;font-size:24px;border-radius:8px;border-width:2.5px}
.plate--lg b{border-right-width:2.5px;padding:0 10px}
.plate--lg span{padding:0 12px}
.plate--lg i{font-size:9px;padding:5px 8px 4px}
.plate--lg i::before{width:20px;height:13px}

/* =========================================================
   1. Оболочка приложения — из redesign-s31: сайдбар, контент, нижние вкладки.
      Второй вариант (body.nav-top) — та же навигация узкой полосой сверху.
   ========================================================= */
html,body{height:100%}
body{overflow:hidden}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
body.nav-top .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
body.nav-top .u-side,body:not(.nav-top) .u-topbar,.p-tabs{display:none}

/* Сайдбар — дословно s31; знак — ArgoDots, как в продукте */
.u-side{background:var(--night);color:var(--on-night);display:flex;flex-direction:column;padding:22px 14px 16px;gap:4px;min-height:0;position:relative;overflow:hidden}
.u-side::after{content:"";position:absolute;left:-40px;right:-40px;bottom:0;height:260px;background:radial-gradient(ellipse 60% 80% at 20% 100%,rgba(229,45,39,.16),transparent 70%);pointer-events:none}
.u-brand{display:flex;align-items:center;gap:12px;color:var(--on-night)}
.u-brand svg{width:40px;height:24px;display:block;flex:none}
.u-brand small{font:600 11px/1 var(--f-text);letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-2)}
.u-side .u-brand{padding:4px 10px 22px}
.u-side__group{font:600 11px/1 var(--f-text);letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-2);padding:18px 12px 8px}
.u-nav{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--on-night);font:500 14px/1 var(--f-text);position:relative;text-align:left;white-space:nowrap}
.u-nav svg{color:var(--on-night-2)}
.u-nav:hover{background:var(--night-2)}
.u-nav.is-on{background:var(--night-3);font-weight:600}
.u-nav.is-on svg{color:#fff}
.u-nav.is-on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.u-nav em{margin-left:auto;font:600 12px/1 var(--f-text);font-style:normal;color:var(--on-night-2)}
.u-side__new{margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--night-line);background:rgba(255,255,255,.02);color:var(--on-night);text-align:left}
.u-side__new span.plus{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--red-act);color:#fff}
.u-side__new b{display:block;font:600 14px/1.2 var(--f-text)}
.u-side__new small{display:block;font:400 12px/1.3 var(--f-text);color:var(--on-night-2)}
.u-side__foot{margin-top:auto;display:grid;gap:10px;position:relative;z-index:1}
.u-loc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--night-line);font:600 13px/1 var(--f-text)}
.u-loc svg{color:var(--on-night-2)}
.u-lang{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;border:1px solid var(--night-line)}
.u-lang button{min-height:32px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:var(--on-night-2);font:700 12px/1 var(--f-text);letter-spacing:.06em}
.u-lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.u-user{display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid var(--night-line)}
.u-ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#3A3F48;color:#fff;font:700 12px/1 var(--f-text);flex:none}
.u-user b{display:block;font:600 13px/1.2 var(--f-text)}
.u-user small{display:block;font:400 12px/1.2 var(--f-text);color:var(--on-night-2)}
.u-out{margin-left:auto;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--on-night-2);display:grid;place-items:center}
.u-out:hover{background:var(--night-2);color:var(--on-night)}

/* Верхняя полоса: тот же хром лентой 56 px. Шапка страницы под ней — без своего фона,
   иначе две полосы хрома подряд. */
.u-topbar{display:flex;align-items:center;gap:20px;padding:0 14px 0 22px;background:var(--night);color:var(--on-night);min-width:0}
.u-topbar nav{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.u-topbar nav::-webkit-scrollbar{display:none}
.u-topbar .u-nav{min-height:36px;padding:0 11px;gap:8px;font-size:13.5px}
.u-topbar .u-nav.is-on::before{left:11px;right:11px;top:auto;bottom:-10px;width:auto;height:3px;border-radius:3px 3px 0 0}
.u-top-end{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.u-topbar .u-lang{width:84px}
.u-topbar .u-lang button{min-height:28px}

/* Контент */
.u-main{min-width:0;min-height:0;display:flex;flex-direction:column;padding:26px 32px 28px}
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.u-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px;flex-wrap:wrap}
.u-eyebrow{font:600 11.5px/1 var(--f-text);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.u-h1{font:800 32px/1.08 var(--f-display);letter-spacing:-.035em;display:flex;align-items:center;gap:12px}
.u-sub{margin-top:8px;color:var(--muted);font-size:14px}
.u-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.count{display:inline-grid;place-items:center;min-width:28px;height:26px;padding:0 8px;border-radius:999px;background:var(--select);color:var(--ink);font:700 13px/1 var(--f-text);letter-spacing:0;font-variant-numeric:tabular-nums}
.btn--primary{background:var(--red-act);color:#fff}
.btn--primary:hover{background:var(--red-press)}
.btn--sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.field{display:flex;align-items:center;gap:10px;min-height:40px;width:260px;padding:0 12px;border:1px solid var(--ctl);border-radius:11px;background:var(--card);color:var(--faint)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:400 14px/1 var(--f-text)}
.field input::placeholder{color:var(--faint)}
.field:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.ev{display:flex;align-items:center;gap:10px}
/* Тумблер дня мероприятия: выкл — дорожка --ctl, вкл — чёрная */
.switch{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:0 12px 0 8px;border:0;border-radius:11px;background:transparent;font:600 14px/1 var(--f-text);color:var(--ink);white-space:nowrap}
.switch:hover{background:var(--hover)}
.switch .trk{position:relative;flex:none;width:40px;height:24px;border-radius:999px;background:var(--ctl);transition:background-color .18s var(--ease-out)}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(15,17,21,.25);transition:transform .18s var(--ease-out)}
.switch[aria-checked="true"] .trk{background:var(--night)}
.switch[aria-checked="true"] .trk::after{transform:translateX(16px)}
.today{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font:600 13px/1 var(--f-text);white-space:nowrap}
.today::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok-dot)}

/* Сцена — один renderer на всё приложение: узел переезжает между слотами страниц */
.slot{flex:1;min-height:0;display:grid}
.stage{position:relative;min-height:0;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg)}
.scene{position:absolute;inset:0}
.scene:focus-visible{outline-offset:-3px}
.scene canvas{display:block;touch-action:none}
.scene.is-pick canvas{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cap{position:absolute;left:16px;top:14px;display:grid;gap:2px;pointer-events:none}
.cap b{font:800 18px/1.15 var(--f-display);letter-spacing:-.02em}
.cap span{font:500 12.5px/1.3 var(--f-text);color:var(--muted)}
.stage-btn{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.92)}

/* Нижний ряд сцены — клавиатурный и текстовый путь к каждому объекту */
.dock{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:600 14px/1 var(--f-text);color:var(--ink);box-shadow:0 1px 2px rgba(15,17,21,.05)}
.chip:hover{border-color:var(--ctl)}
.chip--plate{font:600 13.5px/1 var(--f-mono);letter-spacing:.02em}
.chip[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff}
.toast{position:fixed;left:50%;bottom:28px;z-index:80;transform:translate(-50%,8px);opacity:0;padding:10px 16px;border-radius:12px;background:var(--night);color:var(--on-night);font:500 14px/1.3 var(--f-text);white-space:nowrap;pointer-events:none;transition:opacity .18s,transform .18s var(--ease-out)}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

/* Главная: откат без 3D — плитки s31 с числами home_summary */
.home-list{display:grid;gap:14px;align-content:start}
.home-list__bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;color:var(--muted);font:500 14px/1.3 var(--f-text)}
.p-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.p-tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px;min-height:150px;align-content:space-between;justify-items:start;text-align:left;color:var(--ink)}
.p-tile:hover{border-color:var(--ctl)}
.p-tile svg.i{width:22px;height:22px}
.p-tile b{font:800 30px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.p-tile span{font:600 14px/1.2 var(--f-text)}
.p-tile small{color:var(--faint);font-size:12.5px;display:block;margin-top:4px}
.p-tile small.warn{color:var(--warn)}
.p-tile--dark{background:var(--ink);border-color:var(--ink);color:#fff}
.p-tile--dark:hover{border-color:var(--ink)}
.p-tile--dark small{color:var(--on-night-2)}
.p-tile--wide{grid-column:span 2;min-height:0;grid-template-columns:1fr auto;align-items:center;justify-items:stretch}
.hallsdots{display:flex;gap:5px}
.hallsdots i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:700 11px/1 var(--f-text);font-style:normal;color:#fff;background:var(--c)}
.page-home.is-list .slot,.no-gl .slot{display:none!important}

/* Переключатель вариантов оболочки — только макет */
.mock-nav{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;align-items:center;gap:8px;padding:5px 5px 5px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-pop);font:600 12px/1 var(--f-text);color:var(--muted)}
.mock-nav div{display:inline-flex;padding:2px;gap:2px;border-radius:10px;background:var(--sunk)}
.mock-nav button{min-height:30px;padding:0 11px;border:0;border-radius:8px;background:transparent;font:600 13px/1 var(--f-text);color:var(--muted)}
.mock-nav button[aria-pressed="true"]{background:var(--night);color:#fff}

/* Таблички CSS2D. Слой не ловит мышь — всё решает raycast по 3D. */
.tag{pointer-events:none;display:grid;gap:1px;padding:7px 11px 8px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:0 2px 8px rgba(15,17,21,.06);white-space:nowrap;transition:border-color .12s,box-shadow .12s}
.tag b{font:700 13px/1.2 var(--f-display);letter-spacing:-.01em;color:var(--ink)}
.tag span{font:500 12px/1.3 var(--f-text);color:var(--muted);font-variant-numeric:tabular-nums}
.tag.is-hot{border-color:var(--ink);box-shadow:var(--shadow-pop)}
/* Карточка события над отелем. Анимируем ВНУТРЕННИЙ блок: transform внешнего пишет CSS2DRenderer каждый кадр. */
.evcard{pointer-events:none;margin-bottom:12px}
.evcard>div{display:grid;gap:4px;padding:12px 16px 13px;border-radius:14px;background:var(--card);box-shadow:var(--shadow-pop);white-space:nowrap;animation:evpop .4s var(--ease-out)}
.evcard b{font:800 16px/1.15 var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.evcard .where{font:500 13px/1.3 var(--f-text);color:var(--ink-2)}
.evcard .st{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1.2 var(--f-text);color:var(--ok)}
.evcard .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok-dot)}
.evcard small{font:500 12px/1.3 var(--f-text);color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes evpop{from{opacity:0;transform:translateY(8px) scale(.96)}}
.ptag{pointer-events:none;display:inline-flex;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);font:600 12px/1 var(--f-mono);color:var(--ink);white-space:nowrap;overflow:hidden;transition:background-color .12s,border-color .12s}
.ptag b{padding:5px 6px;border-right:1px solid var(--line);font-weight:600}
.ptag span{padding:5px 7px}
.ptag.is-hot{border-color:var(--ink)}
.ptag.is-sel{background:var(--night);border-color:var(--night);color:#fff}
.ptag.is-sel b{border-color:var(--night-line)}

/* =========================================================
   2. Автомобили: сцена слева, справа карточка выбранной + реестр строками.
      «Свернуть 3D» (.is-flat) — реестр на всю ширину, карточка остаётся справа.
   ========================================================= */
.garage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);gap:16px}
.garage>.slot{grid-row:1/3}
.garage.is-flat>.slot{display:none}
.garage.is-flat .g-list{grid-column:1;grid-row:1/3}
.panel{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.p-head{padding:18px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;border-bottom:1px solid var(--line-2)}
.p-photo{width:56px;height:56px;border-radius:14px;background:var(--sunk);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--muted);font-size:24px}
.p-name{font:800 22px/1.1 var(--f-display);letter-spacing:-.025em}
.p-role{color:var(--muted);margin-top:4px;font-size:14px}
.p-plate{margin-top:12px}
.p-close{display:none}
.p-body{padding:8px 20px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;min-height:40px;border-bottom:1px solid var(--line-2);margin:0}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--faint);font-size:13px}
.kv dd{margin:0;font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px}
.kv dd.q{color:var(--soft);font-weight:400}
.sw{width:16px;height:16px;border-radius:5px;border:1px solid var(--line);flex:none}
.p-foot{padding:12px 20px 14px;border-top:1px solid var(--line-2);display:flex;gap:8px}
.p-foot .btn{flex:1}
.p-empty{display:grid;justify-items:center;gap:6px;padding:26px 24px;text-align:center}
.p-empty .p-photo{border-style:dashed;margin-bottom:6px}
.p-empty h3{font-size:18px;font-weight:800}
.p-empty p{color:var(--muted);font-size:14px}
.p-empty kbd{font:600 12px/1 var(--f-mono);padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--sunk)}

/* Реестр строками — текстовый путь к каждой машине */

      list.forEach((g) => g.dispose());
      const mesh = new THREE.Mesh(geo, m);
      if (edge) mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edge));
      parent.add(mesh);
    }
    buckets.clear();
  };
  return k;
}

// Табличка CSS2D: якорь — нижний центр элемента
function label(parent, html, cls, x, y, z) {
  const el = document.createElement('div');
  el.className = cls;
  el.innerHTML = html;
  const o = new CSS2DObject(el);
  o.position.set(x, y, z);
  o.center.set(0.5, 1);
  parent.add(o);
  return o;
}

// Миниатюра, а не макет района: здание — 8–20 объёмов, окна — 1–3 широкие ленты --select,
// детали крупнее «реальных», рёбра — только у основных объёмов.
const BAND = mat(T.select);
// Дерево-игрушка: куб-ствол + одна-две крупные кроны
function tree(k, x, z, s = 1) {
  k(DARK, 0.5 * s, 1.6 * s, 0.5 * s, x, 0, z);
  k(LEAF, 2.6 * s, 2.2 * s, 2.6 * s, x, 1.6 * s, z, EDGE);
  if (s > 1) k(LEAF, 1.5, 1.2, 1.5, x + 0.2, 1.6 * s + 2.2 * s, z - 0.1, EDGE);
}
// Кейс — один графитовый куб
const crate = (k, x, y0, z, s = 0.7) => k(DARK, s, s, s, x, y0, z);

// Здание: группа с собственным материалом корпуса и рёбер — их подсвечивает наведение
function building(id, x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const body = own(T.card), edge = new THREE.LineBasicMaterial({ color: T.line });
  g.userData = { id, mats: [body], edge };
  roots[id] = g;
  return { g, body, edge, k: kit() };
}

/* ============== Машины: силуэт по модели из 6–10 объёмов. Перёд — +z. ============== */
// w×l, колесо, отступ осей, клиренс, пояс, салон: стекло [z0, z1, высота], крыша [z0, z1]
const SPEC = {
  lynk:   { w: 2.0, l: 5.0, wheel: 0.95, ax: 0.95, ride: 0.42, belt: 1.25, cabW: 1.84, glass: [-2.2, 1.0, 0.55], roof: [-2.2, 0.75] },
  cobalt: { w: 1.74, l: 4.5, wheel: 0.8, ax: 0.85, ride: 0.32, belt: 0.92, cabW: 1.5, glass: [-1.0, 0.85, 0.46], roof: [-0.75, 0.55], trunk: 0.1 },
  nexia:  { w: 1.66, l: 4.26, wheel: 0.76, ax: 0.8, ride: 0.3, belt: 0.86, cabW: 1.5, glass: [-0.95, 0.8, 0.42], roof: [-0.95, 0.8] },
  chazor: { w: 1.72, l: 4.4, wheel: 0.8, ax: 0.82, ride: 0.32, belt: 0.92, cabW: 1.52, glass: [-0.9, 0.7, 0.5], roof: [-0.7, 0.45], trunk: 0.06 },
  bongo:  { w: 1.74, l: 5.1, wheel: 0.78 },
};

function makeCar(c, cargo = false) {
  const g = new THREE.Group();
  const body = own(c.hex), edge = new THREE.LineBasicMaterial({ color: T.line }), k = kit();
  const dark = new THREE.Color(c.hex).getHSL({}).l < 0.4, glass = dark ? DARK : GLASS;
  const lamp = mat(T.warnBg);
  const s = SPEC[c.kind], { w, l, wheel } = s;
  // Колесо — графитовый куб крупнее «настоящего», чуть выступает из кузова
  const wheelAt = (x, z) => k(DARK, 0.32, wheel, wheel, x, 0, z);
  let top, markZ = 0;
  if (c.kind === 'bongo') {
    // Cab-over: высокая кабина без капота + низкая платформа
    const cz = l / 2 - 0.8, pl = l - 1.7, pz = -l / 2 + pl / 2;
    k(body, w, 1.75, 1.6, 0, 0.45, cz, edge);
    k(glass, w + 0.02, 0.62, 0.9, 0, 1.3, cz + 0.36);           // стекло — одна полоса вокруг кабины
    k(body, w, 0.55, pl, 0, 0.45, pz, edge);                     // платформа с бортами одним объёмом
    k(DARK, w - 0.2, 0.06, pl - 0.2, 0, 1.0, pz);                // тёмное дно кузова сверху
    k(lamp, w - 0.3, 0.2, 0.06, 0, 0.62, l / 2 + 0.02);
    for (const sx of [-1, 1]) for (const z of [l / 2 - 0.7, -l / 2 + 1.05]) wheelAt(sx * (w / 2 - 0.12), z);
    if (cargo) { crate(k, -0.4, 1.0, -1.2); crate(k, 0.4, 1.0, -0.4); }
    top = 2.2; markZ = cz;
  } else {
    const { ax, ride, belt, cabW } = s, wz = l / 2 - ax;
    const [g0, g1, gh] = s.glass, [r0, r1] = s.roof;
    k(body, w, belt - ride, l, 0, ride, 0, edge);                // кузов одним объёмом
    k(glass, cabW, gh, g1 - g0, 0, belt, (g0 + g1) / 2);         // полоса стекла
    k(body, cabW + 0.04, 0.12, r1 - r0, 0, belt + gh, (r0 + r1) / 2, edge);   // крыша
    if (s.trunk) { const t0 = -l / 2 + 0.15, t1 = g0 - 0.1; k(body, w - 0.1, s.trunk, t1 - t0, 0, belt, (t0 + t1) / 2, edge); }   // выраженный багажник
    k(lamp, w - 0.3, 0.16, 0.06, 0, belt - 0.24, l / 2 + 0.02);   // фары одним блоком
    for (const sx of [-1, 1]) { wheelAt(sx * (w / 2 - 0.12), wz); wheelAt(sx * (w / 2 - 0.12), -wz); }
    top = belt + gh + 0.12; markZ = (r0 + r1) / 2;
  }
  k.into(g);
  // Красная полоска на крыше — метка выбора
  const mark = box(g, RED, w * 0.5, 0.06, 1, 0, top, markZ);
  mark.visible = false;
  g.userData = { mats: [body], edge, mark, top };
  return g;
}

/* ============== Фигурки ============== */
const CLOTH = [T.select, T.night3, T.line];
// Сотрудник-игрушка: ноги, тело, голова — три объёма. Ходьба — покачивание, без шарниров.
function makePerson(parent, x, z, rot, cloth, withCase) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  const inner = new THREE.Group();
  g.add(inner);
  box(inner, DARK, 0.5, 0.8, 0.34, 0, 0, 0);
  box(inner, mat(cloth), 0.66, 0.75, 0.42, 0, 0.8, 0, EDGE);
  box(inner, WHITE, 0.46, 0.46, 0.46, 0, 1.55, 0, EDGE);
  if (withCase) box(inner, DARK, 0.2, 0.5, 0.6, 0.48, 0.4, 0);
  g.userData = { inner };
  parent.add(g);
  return g;
}
function pose(p, t) {
  const a = Math.sin(t * 9), { inner } = p.userData;
  inner.position.y = Math.abs(a) * 0.1;
  inner.rotation.z = a * 0.07;
}
// Точка на ломаной по пройденному пути: позиция + направление
function along(pts, d) {
  for (let i = 1; i < pts.length; i++) {
    const [ax, az] = pts[i - 1], [bx, bz] = pts[i], len = Math.hypot(bx - ax, bz - az);
    if (d <= len || i === pts.length - 1) { const k = Math.min(1, d / len); return [ax + (bx - ax) * k, az + (bz - az) * k, Math.atan2(bx - ax, bz - az), d >= len]; }
    d -= len;
  }
}
const pathLen = (pts) => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);

/* ============== Мир кампуса ============== */
function ground(parent, size) {
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(size, size), flat(T.bg));
  plane.rotation.x = -Math.PI / 2;
  parent.add(plane);
  // Сетка шагом 1 м: цвет --ink с низкой непрозрачностью, как --grid в токенах
  const grid = new THREE.GridHelper(size, size, T.ink, T.ink);
  grid.material.transparent = true;
  grid.material.opacity = 0.07;
  grid.material.depthWrite = false;
  grid.position.y = 0.06;
  parent.add(grid);
}

// Дорожки — широкие светлые полосы без бордюров; два толстых фонаря
function roads(k) {
  const ROAD = flat(T.line);
  const rect = (x0, x1, z0, z1) => k(ROAD, x1 - x0, 0.04, z1 - z0, (x0 + x1) / 2, 0, (z0 + z1) / 2);
  rect(-34, 30, 16.5, 19.5);                       // главная дорога вдоль фронта
  rect(-9, -6, -10, 16.5);                         // поперечная к отелю
  rect(-28, -9, -10, 2.5);                         // площадь перед отелем
  rect(-16.75, -14.75, 13.5, 16.5);                // вход в офис
  rect(-1, 1, -6, 16.5);                           // от склада к дороге
  for (const [x, z] of [[-4, 15.4], [-10, 3.4]]) { k(DARK, 0.4, 4.2, 0.4, x, 0, z); k(GLASS, 1, 0.8, 1, x, 4.2, z, EDGE); }
}

function buildCampus() {
  const g = new THREE.Group();
  ground(g, 400);

  roads(k);
  k.into(g);
  for (const make of [buildOffice, buildWarehouse, buildGarage, buildHotel]) g.add(make());
  for (const s of SITES) labels[s.id] = label(roots[s.id], `<b>${s.title}</b><span>${s.sub}</span>`, 'tag', 0, roots[s.id].userData.top + 1.2, 0);
  g.add(buildStage());
  labels.event = label(roots.hotel, `<div><b>Bionorica Workshop</b><span class="where">Double Tree by HILTON · 12.10</span><span class="st">идёт</span><small>32 позиции · Jupiter&amp;Uranus</small></div>`, 'evcard', 0, roots.hotel.userData.top - 3, 0);
  labels.event.visible = false;

  // Bongo 3 стоит перед своим проёмом носом к дороге

  const walkers = [

  ].map(([a, b, ph], i) => ({ p: makePerson(g, a[0], a[1], 0, CLOTH[i % 3]), pts: [a, b], ph }));
  [[-13.2, 14.3, 2.6], [-12.4, 14.9, -1.8], [-3.6, 5, 1.2], [-2.6, 5.6, -2.3], [-21.9, 15.6, 0.4], [6, 13.6, 2.8]]
    .forEach(([x, z, r], i) => makePerson(g, x, z, r, CLOTH[(i + 1) % 3]));
  const crew = [[12.5, -2.2], [14, -2], [15.5, -2.3], [17, -2]].map((h, i) => {

  });
  W.life = { van, walkers, crew };
  return g;
}

  scene.add(sun);

  const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 600);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = !reduced;
  controls.dampingFactor = 0.08;
  controls.enablePan = true;
  controls.minPolarAngle = 0.25;          // не в зенит
  controls.maxPolarAngle = 1.38;          // не под землю
  controls.addEventListener('start', () => { state.userMoved = true; });

  W = { renderer, css2d, scene, camera, controls, elapsed: 0 };
  W.campus = buildCampus();
  W.garage = buildGarageView();
  scene.add(W.campus, W.garage);
  homeLife();

  // Кликабельное — только меши объектов; рёбра и земля в raycast не идут
  const collect = (ids, list) => ids.forEach((id) => roots[id].traverse((o) => { if (o.isMesh) { o.userData.root = id; list.push(o); } }));
  collect(['office', 'warehouse', 'garage', 'hotel', 'stage'], pickables.campus);
  collect(CARS.map((_, i) => 'car' + i), pickables.garage);

  new ResizeObserver(([e]) => {
    const { width, height } = e.contentRect;
    if (!width || !height) return;
    renderer.setSize(width, height);
    css2d.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    if (!state.userMoved) placeCamera();
  }).observe(sceneEl);

  bindPointer();
  const timer = new THREE.Timer();   // Clock в r186 устарел
  const bounds = new THREE.Vector3(), shift = new THREE.Vector3();
  renderer.setAnimationLoop((now) => {
    timer.update(now);
    const dt = Math.min(timer.getDelta(), 0.1);
    controls.update();
    // Сдвиг камеры не уводит цель за пределы сцены
    const t = controls.target;
    bounds.set(THREE.MathUtils.clamp(t.x, -40, 40), THREE.MathUtils.clamp(t.y, 0, 14), THREE.MathUtils.clamp(t.z, -40, 40));
    shift.subVectors(bounds, t);
    if (shift.lengthSq() > 0) { t.add(shift); camera.position.add(shift); }
    W.elapsed = timer.getElapsed();
    tickLife(W.elapsed, dt, now);
    renderer.render(scene, camera);
    css2d.render(scene, camera);
  });
}

function placeCamera() {
  if (!W) return;
  const c = CAM[state.view], { camera, controls } = W;
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(c.span[1] / 2 / tan, c.span[0] / 2 / (tan * camera.aspect)) * 1.12;
  const dir = new THREE.Vector3(...c.dir).normalize();
  controls.target.set(...c.target);
  camera.position.copy(controls.target).addScaledVector(dir, dist);
  controls.minDistance = c.min;
  controls.maxDistance = Math.max(c.max, dist * 1.3);
  controls.update();
}

/* ============== Жизнь кампуса: фургон, бригада, прохожие, появление сцены ============== */
// Маршрут Bongo: из проёма → дорога → поперечная → к сцене.
const HOME = [12 + bayX(VAN), 14.6];   // гараж — сплошной объём, Bongo стоит на площадке перед своим проёмом
// Обратно — разворот в три приёма: задом на площадь, вперёд на поперечную, домой, задом в проём.
const OUT = [HOME, [HOME[0], 18], [-7.5, 18], [-7.5, -2.2]];
const BACK = [[-7.5, -2.2], [-10.6, 1], [-7.5, 4.5], [-7.5, 18], [HOME[0], 18], HOME];
const OUT_LEN = pathLen(OUT), BACK_LEN = pathLen(BACK), LEG_FIRST = pathLen(BACK.slice(0, 2)), LEG_LAST = pathLen(BACK.slice(-2));
const CYCLE = 16, DRIVE = 6.5, STOP = 2;           // 6,5 с туда, 2 с у сцены, 6,5 с обратно, 1 с в гараже
let vanYaw = 0;
// cubic-bezier(.2,.8,.2,1) = --ease-out: x(s) решаем делением пополам
const bz = (s, a, b) => 3 * a * s * (1 - s) ** 2 + 3 * b * s * s * (1 - s) + s ** 3;
function easeOut(t) {
  let lo = 0, hi = 1, s = t;
  for (let i = 0; i < 18; i++) { s = (lo + hi) / 2; if (bz(s, 0.2, 0.2) < t) lo = s; else hi = s; }
  return bz(s, 0.8, 1);
}

function homeLife() {
  const { van, crew } = W.life;
  van.position.set(HOME[0], 0, HOME[1]);
  van.rotation.y = vanYaw = 0;
  crew.forEach((c) => { c.p.position.set(c.home[0], 0, c.home[1]); c.p.rotation.y = 0.3; pose(c.p, 0); });
}

function tickLife(time, dt, now) {
  const { van, walkers, crew } = W.life;
  // Сцена растёт из земли за 400 мс (--ease-out); при reduced motion — сразу
  if (W.pop) {
    const k = reduced ? 1 : Math.min(1, (now - W.pop.t0) / 400), e = easeOut(k), s = W.pop.on ? e : 1 - e;
    roots.stage.scale.setScalar(Math.max(s, 0.001));
    roots.stage.visible = s > 0.001;
    if (k >= 1) W.pop = null;
  }
  // Прохожие ходят туда-обратно всегда
  for (const w of walkers) {
    if (reduced) break;
    const L = pathLen(w.pts), d = ((time * 1.3 + w.ph) % (2 * L));
    const [x, z, yaw] = d < L ? along(w.pts, d) : along(w.pts.slice().reverse(), d - L);
    w.p.position.set(x, 0, z); w.p.rotation.y = yaw; pose(w.p, time + w.ph);
  }
  if (!state.event) return;
  const t = time - W.evT0;
  // Бригада идёт к сцене с кейсами и остаётся
  crew.forEach((c, i) => {
    const d = reduced ? 1e3 : Math.max(0, t - i * 0.4) * 4;
    const [x, z, yaw, done] = along(c.pts, d);
    c.p.position.set(x, 0, z);
    c.p.rotation.y = done ? Math.PI : yaw;
    pose(c.p, done ? 0 : time);
  });
  // Фургон
  let pos, rev = false;
  if (reduced) pos = [OUT.at(-1)[0], OUT.at(-1)[1], Math.PI];
  else {
    const c = t % CYCLE;
    if (c < DRIVE) pos = along(OUT, (c / DRIVE) * OUT_LEN);
    else if (c < DRIVE + STOP) pos = along(OUT, OUT_LEN);
    else if (c < 2 * DRIVE + STOP) {
      const d = ((c - DRIVE - STOP) / DRIVE) * BACK_LEN;
      pos = along(BACK, d);
      // задом: первый отрезок (от сцены) и последний (в проём)
      rev = d < LEG_FIRST || d > BACK_LEN - LEG_LAST;
    } else pos = [HOME[0], HOME[1], 0];
  }
  const [x, z, dir] = pos;
  van.position.set(x, 0, z);
  const want = rev ? dir + Math.PI : dir;
  let d = Math.atan2(Math.sin(want - vanYaw), Math.cos(want - vanYaw));   // кратчайший поворот
  vanYaw += reduced ? d : d * Math.min(1, dt * 7);
  van.rotation.y = vanYaw;
}

/* ============== Наведение, выбор, клавиатура ============== */
const ndc = new THREE.Vector2(), ray = new THREE.Raycaster();
function pickAt(ev) {
  const r = W.renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, W.camera);
  // raycast не смотрит на visible: сцену без мероприятия отсекаем руками
  const hit = ray.intersectObjects(pickables[state.view], false).find((h) => h.object.userData.root !== 'stage' || state.event);
  return hit ? hit.object.userData.root : null;
}
function bindPointer() {
  const el = W.renderer.domElement;
  let down = null;
  el.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' && !e.buttons) setHover(pickAt(e)); });
  el.addEventListener('pointerleave', () => setHover(null));
  el.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
  el.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;   // это был поворот, не клик
    const id = pickAt(e);
    if (id) activate(id);
    else if (state.view === 'garage') select(null);
  });
}

function nameOf(id) {
  if (id.startsWith('car')) { const c = CARS[+id.slice(3)]; return `${c.brand} ${c.model} · ${c.plate}`; }
  return NAMES[id];
}

function paint(id) {
  const r = roots[id];
  if (!r) return;
  const hot = state.hover === id;
  r.userData.mats.forEach((m) => m.emissive.set(hot ? 0x5a5a5a : 0x000000));
  r.userData.edge.color.set(hot ? T.ink : T.line);
  const sel = id === 'car' + state.sel;
  if (r.userData.mark) r.userData.mark.visible = sel;
  const el = labels[id]?.element;
  if (el) { el.classList.toggle('is-hot', hot); el.classList.toggle('is-sel', sel); }
}

function setHover(id) {
  if (state.hover === id) return;
  const prev = state.hover;
  state.hover = id;
  if (prev) paint(prev);
  if (id) paint(id);
  sceneEl.classList.toggle('is-pick', !!id);
  if (id) $('hoverLive').textContent = nameOf(id);
}

let toastTimer;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('is-on'), 2400);
}

function activate(id) {
  if (id.startsWith('car')) return select(+id.slice(3));
  if (id === 'garage') return setView('garage');
  toast(`${nameOf(id)} — в макете не раскрыт`);
}

function select(i) {
  const prev = state.sel;
  state.sel = i;
  if (prev != null) paint('car' + prev);
  if (i != null) paint('car' + i);
  dock.querySelectorAll('[data-id]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === 'car' + i)));
  carList.querySelectorAll('[data-car]').forEach((r) => r.setAttribute('aria-selected', String(+r.dataset.car === i)));
  if (i != null) revealRow(i);
  renderPanel();
}

    const on = b.dataset.page === page;
    b.classList.toggle('is-on', on && b.classList.contains('u-nav'));
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  document.title = (view === 'garage' ? 'Автомобили' : 'Главная') + ' · ARGO Склад';
  renderCap();
  renderDock();
  renderPanel();
  if (W) {
    W.campus.visible = view === 'campus';
    W.garage.visible = view === 'garage';
    state.userMoved = false;
    placeCamera();
  }
}
// Стрелки при фокусе в сцене гаража листают машины; Esc снимает выбор
sceneEl.addEventListener('keydown', (e) => {
  if (state.view !== 'garage') return;
  const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (d) {
    e.preventDefault();
    select(state.sel == null ? (d > 0 ? 0 : CARS.length - 1) : (state.sel + d + CARS.length) % CARS.length);
    $('hoverLive').textContent = nameOf('car' + state.sel);
  } else if (e.key === 'Escape') select(null);
});

setNav(store.get('mock-nav') === 'top' ? 'top' : 'side');
setFlat(store.get('mock-garage-flat') === '1', false);
if (hasGL()) {
  initWorld();
  if (reduced) setHomeList(true);   // без движения — плитки по умолчанию, мир по кнопке
} else {
  // Без WebGL: главная — плитки, машины — реестр. Кнопки возврата в мир прячем.
  document.body.classList.add('no-gl');
  $('listNote').textContent = '3D недоступно на этом устройстве — разделы списком';
  $('toWorld').hidden = flatBtn.hidden = true;
  setHomeList(true);
  setFlat(true, false);   // вынужденный режим не запоминаем
}
if (location.hash === '#debug') window.__world = W;   // для проверок: число мешей, позиция фургона
setView('campus');
</script>
</body>
</html>
