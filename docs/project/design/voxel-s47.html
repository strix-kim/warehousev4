<html lang="ru">
<head>
<meta charset="utf-8">

<title>Воксельный мир ARGO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Manrope:wght@600;700;800&subset=cyrillic,latin&display=swap">
<style>
/* =========================================================
   0. Токены — дословно из redesign-s31.html. 3D читает их же через getComputedStyle.
   ========================================================= */
:root{
  color-scheme: light;
  --bg:#EEF0F3; --grid:rgba(22,24,29,.055);
  --card:#FFFFFF; --sunk:#F5F6F8; --hover:#F0F2F5; --select:#E9ECF1;
  --ink:#16181D; --ink-2:#2A2E36; --muted:#5F6470; --faint:#676C77; --soft:#8A8F9A;
  --line:#DDE0E5; --line-2:#E8EAEE; --ctl:#858A95;
  --red:#E52D27; --red-act:#C8201B; --red-press:#AE1B16; --red-tint:#FCEAE9;
  --night:#0F1115; --night-2:#1A1D23; --night-3:#262A31; --night-line:#2C3038;
  --on-night:#E8EAEE; --on-night-2:#9CA1AC; --red-night:#FF5A52; --bad-night:#FF8095;
  --ok:#1B7A45; --ok-bg:#E3F3EA; --ok-dot:#2A9D5C;
  --warn:#8A5A00; --warn-bg:#FBF0D5; --warn-dot:#B7800A;
  --bad:#B0203F; --bad-bg:#FBE6EA; --bad-dot:#B0203F;
  --focus:#16181D;
  --r-xl:22px; --r-lg:18px; --r-md:12px; --r-sm:8px;
  --f-display:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --shadow-pop:0 18px 48px rgba(15,17,21,.16),0 2px 6px rgba(15,17,21,.06);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Кнопки и госномер — из s31 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:11px;border:1px solid transparent;font:600 14px/1 var(--f-text);white-space:nowrap;transition:background-color .12s,border-color .12s,transform .12s var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn--ink{background:var(--ink);color:#fff}
.btn--ink:hover{background:#000}
.btn--secondary{background:var(--card);border-color:var(--ctl);color:var(--ink)}
.btn--secondary:hover{background:var(--hover)}
.plate{width:max-content;display:inline-flex;align-items:stretch;height:30px;border:2px solid var(--ink);border-radius:6px;background:#fff;font:600 16px/1 var(--f-mono);color:var(--ink);letter-spacing:.02em;overflow:hidden;white-space:nowrap}
.plate b{display:grid;place-items:center;padding:0 7px;border-right:2px solid var(--ink);font-weight:600}
.plate span{display:grid;place-items:center;padding:0 9px}
.plate i{display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:3px 5px 2px;font:700 7px/1 var(--f-text);font-style:normal}
.plate i::before{content:"";display:block;width:14px;height:9px;background:linear-gradient(#1EB5E6 0 33%,#fff 33% 38%,#E52D27 38% 42%,#fff 42% 58%,#E52D27 58% 62%,#fff 62% 67%,#1EB53A 67%);border:.5px solid #cfd3d9}
.plate--lg{height:44px;font-size:24px;border-radius:8px;border-width:2.5px}
.plate--lg b{border-right-width:2.5px;padding:0 10px}
.plate--lg span{padding:0 12px}
.plate--lg i{font-size:9px;padding:5px 8px 4px}
.plate--lg i::before{width:20px;height:13px}

/* =========================================================
   1. Каркас: шапка + рабочая область
   ========================================================= */
html,body{height:100%}
body{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.top{display:flex;align-items:center;gap:12px 16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.brand svg{width:40px;height:24px;color:var(--red);flex:none}
.brand b{font:800 17px/1.1 var(--f-display);letter-spacing:-.02em;white-space:nowrap}
.brand small{font:600 12px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tabs{display:inline-flex;padding:3px;gap:2px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.tabs button{min-height:36px;padding:0 14px;border:0;border-radius:9px;background:transparent;font:600 14px/1 var(--f-text);color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--night);color:#fff}
.tabs button:hover:not([aria-selected="true"]){background:var(--hover);color:var(--ink)}
.ev{display:flex;align-items:center;gap:10px}
/* Тумблер «Сегодня мероприятие»: выкл — дорожка --ctl, вкл — чёрная */
.switch{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:0 12px 0 8px;border:0;border-radius:11px;background:transparent;font:600 14px/1 var(--f-text);color:var(--ink);white-space:nowrap}
.switch:hover{background:var(--hover)}
.switch .trk{position:relative;flex:none;width:40px;height:24px;border-radius:999px;background:var(--ctl);transition:background-color .18s var(--ease-out)}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(15,17,21,.25);transition:transform .18s var(--ease-out)}
.switch[aria-checked="true"] .trk{background:var(--night)}
.switch[aria-checked="true"] .trk::after{transform:translateX(16px)}
.today{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font:600 13px/1 var(--f-text);white-space:nowrap}
.today::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok-dot)}

.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.app.is-garage{grid-template-columns:minmax(0,1fr) 420px;gap:16px;padding:16px}
.stage{position:relative;min-height:0;overflow:hidden;background:var(--bg)}
.app.is-garage .stage{border:1px solid var(--line);border-radius:var(--r-lg)}
.scene{position:absolute;inset:0}
.scene:focus-visible{outline-offset:-3px}
.scene canvas{display:block;touch-action:none}
.scene.is-pick canvas{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font:600 15px/1.5 var(--f-text);padding:24px}
.cap{position:absolute;left:16px;top:14px;display:grid;gap:2px;pointer-events:none}
.cap b{font:800 18px/1.15 var(--f-display);letter-spacing:-.02em}
.cap span{font:500 12.5px/1.3 var(--f-text);color:var(--muted)}

/* Нижняя панель — клавиатурный и текстовый путь к каждому объекту сцены */
.dock{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:600 14px/1 var(--f-text);color:var(--ink);box-shadow:0 1px 2px rgba(15,17,21,.05)}
.chip:hover{border-color:var(--ctl)}
.chip--plate{font:600 13.5px/1 var(--f-mono);letter-spacing:.02em}
.chip[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff}
.toast{position:absolute;left:50%;bottom:72px;transform:translate(-50%,8px);opacity:0;padding:10px 16px;border-radius:12px;background:var(--night);color:var(--on-night);font:500 14px/1.3 var(--f-text);white-space:nowrap;pointer-events:none;transition:opacity .18s,transform .18s var(--ease-out)}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

/* Таблички CSS2D. Слой не ловит мышь — всё решает raycast по 3D. */
.tag{pointer-events:none;display:grid;gap:1px;padding:7px 11px 8px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:0 2px 8px rgba(15,17,21,.06);white-space:nowrap;transition:border-color .12s,box-shadow .12s}
.tag b{font:700 13px/1.2 var(--f-display);letter-spacing:-.01em;color:var(--ink)}
.tag span{font:500 12px/1.3 var(--f-text);color:var(--muted);font-variant-numeric:tabular-nums}
.tag.is-hot{border-color:var(--ink);box-shadow:var(--shadow-pop)}
/* Карточка события над отелем. Анимируем ВНУТРЕННИЙ блок: transform внешнего пишет CSS2DRenderer каждый кадр. */
.evcard{pointer-events:none;margin-bottom:12px}
.evcard>div{display:grid;gap:4px;padding:12px 16px 13px;border-radius:14px;background:var(--card);box-shadow:var(--shadow-pop);white-space:nowrap;animation:evpop .4s var(--ease-out)}
.evcard b{font:800 16px/1.15 var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.evcard .where{font:500 13px/1.3 var(--f-text);color:var(--ink-2)}
.evcard .st{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1.2 var(--f-text);color:var(--ok)}
.evcard .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok-dot)}
.evcard small{font:500 12px/1.3 var(--f-text);color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes evpop{from{opacity:0;transform:translateY(8px) scale(.96)}}
.ptag{pointer-events:none;display:inline-flex;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);font:600 12px/1 var(--f-mono);color:var(--ink);white-space:nowrap;overflow:hidden;transition:background-color .12s,border-color .12s}
.ptag b{padding:5px 6px;border-right:1px solid var(--line);font-weight:600}
.ptag span{padding:5px 7px}
.ptag.is-hot{border-color:var(--ink)}
.ptag.is-sel{background:var(--night);border-color:var(--night);color:#fff}
.ptag.is-sel b{border-color:var(--night-line)}

/* =========================================================
   2. Рабочая панель гаража — облик профиля машины из s31
   ========================================================= */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.p-head{padding:22px;display:grid;grid-template-columns:auto 1fr;gap:16px;border-bottom:1px solid var(--line-2)}
.p-photo{width:64px;height:64px;border-radius:14px;background:var(--sunk);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--muted);font-size:26px}
.p-name{font:800 24px/1.1 var(--f-display);letter-spacing:-.025em}
.p-role{color:var(--muted);margin-top:4px;font-size:14px}
.p-plate{margin-top:14px}
.p-body{flex:1;min-height:0;overflow:auto;padding:18px 22px}
.p-body h4{font:600 11px/1 var(--f-text);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:center;min-height:44px;border-bottom:1px solid var(--line-2);margin:0}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--faint);font-size:13px}
.kv dd{margin:0;font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px}
.kv dd.m{font-family:var(--f-mono)}
.kv dd.q{color:var(--soft);font-weight:400}
.sw{width:16px;height:16px;border-radius:5px;border:1px solid var(--line)}
.p-foot{padding:14px 22px;border-top:1px solid var(--line-2);display:flex;gap:8px}
.p-foot .btn{flex:1}
.p-empty{flex:1;display:grid;place-content:center;justify-items:center;gap:8px;padding:32px;text-align:center}
.p-empty .p-photo{border-style:dashed;margin-bottom:6px}
.p-empty h3{font-size:19px;font-weight:800}
.p-empty p{color:var(--muted);font-size:14px}
.p-empty kbd{font:600 12px/1 var(--f-mono);padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--sunk)}

/* =========================================================
   3. Телефон 390: колонки становятся строками, панель — листом
   ========================================================= */
@media (max-width:640px){
  body{display:block;height:auto;overflow-x:hidden;overflow-y:auto}
  html{height:auto}
  .top{flex-wrap:wrap;padding:10px 16px}
  .brand small{display:none}
  .tabs{order:3;width:100%;display:grid;grid-template-columns:repeat(2,1fr)}
  .ev{order:2;width:100%;flex-direction:row-reverse;justify-content:space-between;gap:8px}
  .switch{padding-left:0}
  .today .l-long{display:none}
  .app,.app.is-garage{display:block;padding:0}
  .stage{height:calc(100svh - 160px);min-height:420px}
  .app.is-garage .stage{height:52svh;min-height:320px;border:0;border-radius:0}
  .dock{justify-content:flex-start}
  .app.is-garage .dock{padding-bottom:28px}
  .app.is-garage .toast{bottom:88px}
  .panel{position:relative;z-index:3;margin-top:-18px;border-radius:var(--r-xl) var(--r-xl) 0 0;border-bottom:0;box-shadow:var(--shadow-pop);min-height:48svh}
  .p-head,.p-body{padding-inline:18px}
  .p-foot{padding:14px 18px 22px}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .cap b{font-size:16px}
  /* 6 номеров в 390 не помещаются — на телефоне виден только наведённый/выбранный, остальные в нижней панели */
  .ptag:not(.is-hot):not(.is-sel){opacity:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<body>
<header class="top">
  <div class="brand">
    <svg id="argoDots" viewBox="0 0 420 249" fill="currentColor" aria-hidden="true" focusable="false"></svg>
    <b>Воксельный мир</b><small>· макет с47</small>
  </div>
  <div class="ev">
    <span class="today" id="today" hidden><span><span class="l-long">Сегодня: </span>1 мероприятие</span></span>
    <button type="button" class="switch" id="evSwitch" role="switch" aria-checked="false"><span class="trk" aria-hidden="true"></span>Сегодня мероприятие</button>
  </div>
  <div class="tabs" role="tablist" aria-label="Вид мира" id="tabs">
    <button type="button" role="tab" id="tab-campus" data-view="campus" aria-controls="stage" aria-selected="true">Кампус</button>
    <button type="button" role="tab" id="tab-garage" data-view="garage" aria-controls="stage" aria-selected="false" tabindex="-1">Гараж</button>
  </div>
</header>

<main class="app" id="app">

</main>
<p class="vh" id="hoverLive" aria-live="polite"></p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-sheet" viewBox="0 0 24 24"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 12h7M9 16h7M12.5 10.5V19"/></symbol>
</svg>

<script type="module">

document.getElementById('argoDots').innerHTML = ARGO_DOTS.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('');

// Данные прода (vehicles) — зашиты в макет. kind решает силуэт: у каждой модели свои пропорции.
const CARS = [

// Здания кампуса: числа на табличках — как в home_summary; ev — подпись в день мероприятия
const SITES = [
  { id: 'office', name: 'Офис', title: 'Офис · Списки', sub: '6 списков' },
  { id: 'warehouse', name: 'Склад', title: 'Склад · Оборудование', sub: '1 867 единиц · 217 моделей', ev: '1 867 единиц · 86 на выезде' },

];

/* ============== 3D: примитивы ============== */
// Одна геометрия 1×1×1 на всё: размер — scale (отдельные меши) или матрица (сборки kit)
const BOX = new THREE.BoxGeometry(1, 1, 1);
const BOX_EDGES = new THREE.EdgesGeometry(BOX);
const MATS = new Map(), FLATS = new Map();
const mat = (c) => MATS.get(c) || MATS.set(c, new THREE.MeshLambertMaterial({ color: c })).get(c);
const flat = (c) => FLATS.get(c) || FLATS.set(c, new THREE.MeshBasicMaterial({ color: c })).get(c);   // земля и разметка — без света, 1:1 с токеном
const own = (c) => new THREE.MeshLambertMaterial({ color: c });   // свой материал корпуса — под подсветку наведения
const shade = (c, k) => '#' + new THREE.Color(c).multiplyScalar(k).getHexString();
const mix = (a, b, k) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), k).getHexString();
const EDGE = new THREE.LineBasicMaterial({ color: T.line });
// Графит мира — только --night-3: чистый --night слишком тяжёлый, он остаётся за HTML-хромом
const GLASS = mat(T.select), DARK = mat(T.night3), WHITE = mat(T.card), RED = mat(T.red), STEEL = mat(T.ctl);
const LEAF = mat(mix(T.ok, T.card, 0.4));   // зелень приглушённая

// Отдельный куб: размеры w×h×d, (x, z) — центр, y0 — низ. edgeMat — подчеркнуть рёбра.
function box(parent, m, w, h, d, x, y0, z, edgeMat) {
  const o = new THREE.Mesh(BOX, m);
  o.scale.set(w, h, d);
  o.position.set(x, y0 + h / 2, z);
  if (edgeMat) o.add(new THREE.LineSegments(BOX_EDGES, edgeMat));
  parent.add(o);
  return o;
}

// Сборка: копит кубы и в конце сливает их в один меш на пару (материал, рёбра).
// Здание из 150 деталей = 6–8 мешей вместо 150.
const _mx = new THREE.Matrix4(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _q = new THREE.Quaternion();
function kit() {
  const buckets = new Map();
  const k = (m, w, h, d, x, y0, z, edge) => {
    const key = m.uuid + (edge ? edge.uuid : '');
    if (!buckets.has(key)) buckets.set(key, { m, edge, list: [] });
    _mx.compose(_p.set(x, y0 + h / 2, z), _q, _s.set(w, h, d));
    buckets.get(key).list.push(BOX.clone().applyMatrix4(_mx));
  };
  k.into = (parent) => {
    for (const { m, edge, list } of buckets.values()) {
      const geo = mergeGeometries(list);
      list.forEach((g) => g.dispose());
      const mesh = new THREE.Mesh(geo, m);
      if (edge) mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edge));
      parent.add(mesh);
    }
    buckets.clear();
  };
  return k;
}

// Табличка CSS2D: якорь — нижний центр элемента
function label(parent, html, cls, x, y, z) {
  const el = document.createElement('div');
  el.className = cls;
  el.innerHTML = html;
  const o = new CSS2DObject(el);
  o.position.set(x, y, z);
  o.center.set(0.5, 1);
  parent.add(o);
  return o;
}

// Окна-вставки по фасадам прямоугольника [x0, x1, z0, z1]: тёмное стекло + белый отлив с рёбрами.
// faces: F — +z, B — −z, R — +x, L — −x. skip(face, a, y) — пропустить окно (вход, ворота).
function windows(k, [x0, x1, z0, z1], ys, ww, wh, nx, nz, faces = 'FBRL', skip) {
  const pane = (face, a, y) => {
    if (skip?.(face, a, y)) return;
    if (face === 'F' || face === 'B') {
      const z = face === 'F' ? z1 : z0, s = face === 'F' ? 1 : -1;
      k(DARK, ww, wh, 0.1, a, y, z);
      k(WHITE, ww + 0.24, 0.1, 0.26, a, y - 0.1, z + s * 0.08, EDGE);
    } else {
      const x = face === 'R' ? x1 : x0, s = face === 'R' ? 1 : -1;
      k(DARK, 0.1, wh, ww, x, y, a);
      k(WHITE, 0.26, 0.1, ww + 0.24, x + s * 0.08, y - 0.1, a, EDGE);
    }
  };
  for (const y of ys) {
    for (let i = 0; i < nx; i++) { const a = x0 + ((x1 - x0) / nx) * (i + 0.5); if (faces.includes('F')) pane('F', a, y); if (faces.includes('B')) pane('B', a, y); }
    for (let i = 0; i < nz; i++) { const a = z0 + ((z1 - z0) / nz) * (i + 0.5); if (faces.includes('R')) pane('R', a, y); if (faces.includes('L')) pane('L', a, y); }
  }
}
// Парапет по краю крыши [x0, x1, z0, z1] на высоте y
function parapet(k, [x0, x1, z0, z1], y, h = 0.6) {
  k(WHITE, x1 - x0, h, 0.25, (x0 + x1) / 2, y, z1 - 0.125, EDGE);
  k(WHITE, x1 - x0, h, 0.25, (x0 + x1) / 2, y, z0 + 0.125, EDGE);
  k(WHITE, 0.25, h, z1 - z0 - 0.5, x1 - 0.125, y, (z0 + z1) / 2, EDGE);
  k(WHITE, 0.25, h, z1 - z0 - 0.5, x0 + 0.125, y, (z0 + z1) / 2, EDGE);
}
// Дерево: графитовый ствол + крона из 2–3 светлых кубов
function tree(k, x, z, s = 1) {
  k(DARK, 0.3, 1.5 * s, 0.3, x, 0, z);
  k(mat(T.sunk), 1.9 * s, 1.5 * s, 1.9 * s, x, 1.5 * s, z, EDGE);
  k(mat(T.sunk), 1.3 * s, 1.1 * s, 1.3 * s, x + 0.2, 3 * s, z - 0.15, EDGE);
  if (s > 1) k(mat(T.sunk), 0.8, 0.7, 0.8, x - 0.1, 3 * s + 1.1 * s, z + 0.1, EDGE);
}
// Кейс: графитовый куб с белой ручкой
function crate(k, x, y0, z, s = 0.62) {
  k(DARK, s, s, s, x, y0, z);
  k(WHITE, s * 0.4, 0.06, 0.08, x, y0 + s, z);
}

// Здание: группа с собственным материалом корпуса и рёбер — их подсвечивает наведение
function building(id, x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const body = own(T.card), edge = new THREE.LineBasicMaterial({ color: T.line });
  g.userData = { id, mats: [body], edge };
  roots[id] = g;
  return { g, body, edge, k: kit() };
}

/* ============== Здания: у каждого свой силуэт и свой «жест» ============== */
// Офис: Г-образный план, второй этаж консолью над входом, угол — стеклянный атриум, терраса на крыше
function buildOffice() {
  const { g, body, edge, k } = building('office', -18, 8);
  // локальные координаты: центр (−18, 8). Западное крыло (вдоль z), южное крыло (вдоль x), атриум на стыке
  k(body, 4.5, 7, 6, -3.75, 0, -1.5, edge);                 // западное крыло, 2 этажа
  k(body, 7.5, 3.5, 5, 2.25, 0, 1.5, edge);                 // южное крыло, первый этаж
  k(body, 7.5, 3.5, 6.5, 2.25, 3.5, 2.25, edge);            // второй этаж — консоль на 1,5 м наружу
  k(GLASS, 7.5, 0.2, 6.5, 2.25, 7, 2.25);                   // светлый настил террасы
  k(DARK, 7.7, 0.08, 6.7, 2.25, 6.95, 2.25);
  k(DARK, 4.7, 0.3, 6.2, -3.75, 7, -1.5);
  // Атриум во всю высоту: стекло, графитовые импосты
  k(GLASS, 4.5, 7.6, 3, -3.75, 0, 3, EDGE);
  for (const y of [2.5, 5]) { k(DARK, 4.56, 0.08, 0.06, -3.75, y, 4.52); k(DARK, 0.06, 0.08, 3.04, -6.02, y, 3); }
  for (const x of [-5.25, -3.75, -2.25]) k(DARK, 0.08, 7.6, 0.06, x, 0, 4.52);
  k(DARK, 4.7, 0.25, 3.2, -3.75, 7.6, 3);
  // Стойки под консолью и вход
  for (const x of [-1, 5.5]) k(DARK, 0.3, 3.5, 0.3, x, 0, 5.3);
  k(GLASS, 2, 2.6, 0.12, 2.25, 0, 4.02, EDGE);
  k(DARK, 2.2, 0.15, 0.14, 2.25, 2.6, 4.03);
  k(WHITE, 3, 0.15, 1.4, 2.25, 0, 4.7, EDGE);               // ступени
  k(WHITE, 2.4, 0.15, 0.7, 2.25, 0.15, 4.35, EDGE);
  // Вывеска ARGO на торце консоли: графит + три красных кубика
  k(DARK, 3.4, 1, 0.16, 2.25, 4.8, 5.58);
  for (const dx of [-0.8, 0, 0.8]) k(RED, 0.42, 0.42, 0.3, 2.25 + dx, 5.09, 5.66);
  // Окна
  windows(k, [-6, -1.5, -4.5, 1.5], [1, 4.5], 1.1, 1.5, 0, 3, 'BL');
  windows(k, [-6, -1.5, -4.5, 1.5], [1, 4.5], 1.1, 1.5, 3, 0, 'B');
  windows(k, [-1.5, 6, -1, 5.5], [4.5], 1.2, 1.5, 4, 0, 'F', (f, a) => Math.abs(a - 2.25) < 1);
  windows(k, [-1.5, 6, -1, 4], [1], 1.2, 1.5, 0, 3, 'R');
  windows(k, [-1.5, 6, -1, 5.5], [4.5], 1.2, 1.5, 0, 4, 'R');
  windows(k, [-1.5, 6, -1, 4], [1, 4.5], 1.2, 1.5, 3, 0, 'B');
  // Терраса: парапет и кадки с зеленью; на западном крыле — два кондиционера
  parapet(k, [-1.5, 6, -1, 5.5], 7.2, 0.7);
  for (const x of [0.5, 4]) { k(mat(T.sunk), 0.9, 0.7, 0.9, x, 7.2, 3.8, EDGE); k(LEAF, 0.6, 0.5, 0.6, x, 7.9, 3.8); }
  for (const z of [-3, -0.5]) { k(WHITE, 1.4, 1, 1.2, -3.75, 7.3, z, EDGE); k(DARK, 0.8, 0.08, 0.8, -3.75, 8.3, z); }
  // Флагшток у входа, два дерева, скамейки
  k(DARK, 0.12, 6.5, 0.12, 6.9, 0, 5.9);
  k(RED, 1.3, 0.8, 0.06, 7.6, 5.6, 5.9);
  tree(k, -7.6, 5.2, 1.1);
  tree(k, 7.4, 1.5);
  for (const x of [-5.2, -2.6]) { k(WHITE, 1.8, 0.12, 0.6, x, 0.45, 6.9, EDGE); k(WHITE, 1.8, 0.5, 0.1, x, 0.57, 6.65, EDGE); k(DARK, 0.1, 0.45, 0.5, x - 0.75, 0, 6.9); k(DARK, 0.1, 0.45, 0.5, x + 0.75, 0, 6.9); }
  k.into(g);
  g.userData.top = 8.4;
  return g;
}

// Склад: ангар с пилообразной крышей (4 зуба, каждый — 3 ступени), башня-офис с торца, рампа с навесом
function buildWarehouse() {
  const { g, body, edge, k } = building('warehouse', 7, -12);
  // локальные: x −13..13, z −6..6
  k(body, 26, 5, 12, 0, 0, 0, edge);
  for (let t = 0; t < 4; t++) {
    const a = -13 + t * 6.5;
    k(body, 6.5, 0.7, 12, a + 3.25, 5, 0, edge);
    k(body, 4.3, 0.7, 12, a + 4.35, 5.7, 0, edge);
    k(body, 2.2, 0.7, 12, a + 5.4, 6.4, 0, edge);
    k(GLASS, 0.1, 1.3, 11.4, a + 6.5, 5.75, 0, EDGE);      // остекление на вертикальной грани зуба
  }
  // Башня — офис склада, выше ангара
  k(body, 4.5, 11, 7, 15.25, 0, -2.5, edge);
  k(DARK, 4.7, 0.3, 7.2, 15.25, 11, -2.5);
  windows(k, [13, 17.5, -6, 1], [1.2, 4.2, 7.2], 1.1, 1.5, 2, 3, 'FR');
  k(WHITE, 1.4, 1, 1.4, 15.6, 11.3, -3.5, EDGE);
  // Ворота с ламелями: у рампы (поднятые) и на земле
  for (const [x, y0] of [[8.75, 1.1], [-6, 0]]) {
    k(DARK, 4.4, 3.4, 0.12, x, y0, 6.02);
    for (let i = 1; i <= 4; i++) k(mat(T.ctl), 4.2, 0.07, 0.06, x, y0 + i * 0.68, 6.1);
  }
  // Высокие узкие окна под крышей + задний фасад
  windows(k, [-13, 13, -6, 6], [3], 0.6, 1.6, 13, 0, 'F', (f, a) => Math.abs(a - 8.75) < 3 || Math.abs(a + 6) < 3);
  windows(k, [-13, 13, -6, 6], [3], 0.6, 1.6, 13, 4, 'BL');
  // Рампа: платформа + две ступени, навес на двух стойках
  k(WHITE, 7.5, 1.1, 2.8, 8.75, 0, 7.4, EDGE);
  k(WHITE, 0.6, 0.73, 2.8, 4.7, 0, 7.4, EDGE);
  k(WHITE, 0.6, 0.37, 2.8, 4.1, 0, 7.4, EDGE);
  k(WHITE, 8.8, 0.2, 3.6, 8.75, 4.3, 7.8, EDGE);
  for (const x of [4.8, 12.6]) k(DARK, 0.2, 4.3, 0.2, x, 0, 9.4);
  // Вентиляция на нижних ступенях зубьев
  for (const x of [-11.9, -5.4, 1.1]) { k(WHITE, 0.9, 0.9, 0.9, x, 5.7, -3, EDGE); k(DARK, 0.6, 0.1, 0.6, x, 6.6, -3); }
  // Кейсы у рампы (два штабелем) и ручная тележка
  for (const [x, z, y] of [[5.6, 6.6, 1.1], [6.3, 6.6, 1.1], [5.6, 6.6, 1.72], [7, 7.3, 1.1], [5.9, 7.5, 1.1], [7.7, 6.6, 1.1]]) crate(k, x, y, z);
  k(DARK, 0.7, 0.08, 0.6, 11.3, 1.1, 7.6);
  k(DARK, 0.08, 1.3, 0.6, 11.66, 1.1, 7.6);
  k(DARK, 0.3, 0.06, 0.6, 11.8, 2.34, 7.6);
  crate(k, 11.2, 1.18, 7.6, 0.5);
  k.into(g);
  g.userData.top = 11.5;
  return g;
}

// Гараж: 6 открытых проёмов с воротами-козырьками, односкатная крыша ступенями, мезонин сверху, навес-мойка сбоку
const bayX = (i) => -7.5 + i * 3;     // локальный x проёма; мир: +12
function buildGarage() {
  const { g, body, edge, k } = building('garage', 12, 8);
  // локальные: x −9..9, z −4.5..4.5; фронт +z
  k(body, 18, 4.5, 0.3, 0, 0, -4.35, edge);                  // задняя стена
  k(body, 0.3, 4.5, 9, -8.85, 0, 0, edge);
  k(body, 0.3, 4.5, 9, 8.85, 0, 0, edge);
  for (let i = 0; i <= 6; i++) { const x0 = i === 0 ? -9 : bayX(i - 1) + 1.1, x1 = i === 6 ? 9 : bayX(i) - 1.1; k(body, x1 - x0, 3, 0.3, (x0 + x1) / 2, 0, 4.35, edge); }
  k(body, 18, 1.5, 0.3, 0, 3, 4.35, edge);                   // перемычка над проёмами
  k(DARK, 17.4, 3, 7.9, 0, 0, -0.35);                        // тёмная глубина внутри
  k(body, 18.2, 0.3, 9.2, 0, 4.5, 0, edge);                  // односкатная крыша: три ступени к задней стене
  k(body, 18.2, 0.5, 6, 0, 4.8, -1.6, edge);
  k(body, 18.2, 0.5, 3, 0, 5.3, -3.1, edge);
  k(DARK, 18.4, 0.12, 0.2, 0, 4.4, 4.62);
  // Ворота-козырьки: поднятое полотно над каждым проёмом
  for (let i = 0; i < 6; i++) {
    k(WHITE, 2.3, 0.08, 0.9, bayX(i), 3.05, 4.95, EDGE);
    k(DARK, 0.05, 0.3, 0.9, bayX(i) - 1.12, 2.8, 4.95);
    k(DARK, 0.05, 0.3, 0.9, bayX(i) + 1.12, 2.8, 4.95);
  }
  // Мезонин с окнами и вывеской
  k(body, 7, 2.6, 4, 4.5, 5.8, -2.5, edge);
  k(DARK, 7.2, 0.2, 4.2, 4.5, 8.4, -2.5);
  windows(k, [1, 8, -4.5, -0.5], [6.5], 1.2, 1.1, 4, 0, 'F');
  k(DARK, 5, 1, 0.2, -3, 5.8, -0.8);
  k(WHITE, 3.6, 0.14, 0.06, -3.4, 6.2, -0.68);
  for (const dx of [0.9, 1.45, 2]) k(RED, 0.3, 0.3, 0.12, -3 + dx, 6.1, -0.68);
  for (const x of [-5, -1]) k(DARK, 0.12, 0.5, 0.12, x, 5.3, -0.9);
  // Навес-мойка справа: плита на 4 стойках, светлая площадка
  k(mat(T.sunk), 4.8, 0.05, 6.4, 11.6, 0, 0.6, EDGE);
  for (const x of [9.6, 13.6]) for (const z of [-2.2, 3.4]) k(DARK, 0.2, 3.6, 0.2, x, 0, z);
  k(WHITE, 5.2, 0.25, 6.8, 11.6, 3.6, 0.6, EDGE);
  k(GLASS, 0.8, 1.4, 0.8, 13.2, 0, -1.6, EDGE);
  // Передки машин в проёмах (Bongo — целой моделью, он уезжает на мероприятие)
  CARS.forEach((c, i) => {
    if (i === VAN) return;
    const cm = mat(c.hex), x = bayX(i), dark = new THREE.Color(c.hex).getHSL({}).l < 0.4;
    k(cm, 1.7, 0.6, 1.4, x, 0.38, 3.9, EDGE);
    k(dark ? DARK : GLASS, 1.4, 0.4, 0.7, x, 0.98, 3.55);
    k(cm, 1.44, 0.08, 0.6, x, 1.38, 3.5);
    for (const s of [-1, 1]) { k(mat(T.warnBg), 0.34, 0.14, 0.06, x + s * 0.55, 0.78, 4.62); k(DARK, 0.22, 0.6, 0.6, x + s * 0.72, 0, 4.0); }
    k(mat(shade(c.hex, 0.8)), 1.72, 0.2, 0.14, x, 0.36, 4.62);
  });
  // Парковочная разметка перед гаражом: светлая площадка, полосы --line
  k(mat(T.sunk), 18, 0.03, 4, 0, 0, 6.5);
  for (let i = 0; i <= 6; i++) k(flat(T.line), 0.14, 0.05, 3.4, -9 + i * 3, 0, 6.6);
  k.into(g);
  g.userData.top = 8.6;
  return g;
}

// Отель: подиум 2 этажа во весь план + башня у края с двумя уступами, пилон на крыше, портик, терраса с зонтиками
function buildHotel() {
  const { g, body, edge, k } = building('hotel', -20, -15);
  // локальные: подиум x −7..7, z −5..5; башня у западного края
  k(body, 14, 7, 10, 0, 0, 0, edge);
  k(GLASS, 14, 0.2, 10, 0, 7, 0);                          // настил террасы подиума
  k(DARK, 14.2, 0.08, 10.2, 0, 6.95, 0);
  const T1 = [-7, 0.5, -5, 1.5], T2 = [-6.3, -0.2, -4.3, 0.8], T3 = [-5.6, -0.9, -3.6, 0.1];
  const slab = (r, y0, h) => k(body, r[1] - r[0], h, r[3] - r[2], (r[0] + r[1]) / 2, y0, (r[2] + r[3]) / 2, edge);

/* ============== Машины: силуэт по модели. Перёд — +z. ============== */
// Спецификации: w×l, колесо (размер) и отступ осей, пояс (верх капота), салон и т. д.
const SPEC = {
  lynk:   { w: 2.0, l: 5.0, wheel: 0.8, ax: 0.95, ride: 0.42, belt: 1.25, cabW: 1.84, glass: [-2.1, 1.0, 0.52], roof: [-1.35, 0.75], step: [-2.3, -2.1, 0.32], lamp: 0.42, bump: 0.26 },
  cobalt: { w: 1.74, l: 4.5, wheel: 0.64, ax: 0.85, ride: 0.3, belt: 0.92, cabW: 1.5, glass: [-1.0, 0.85, 0.44], roof: [-0.75, 0.55], trunk: 0.1, lamp: 0.36, bump: 0.22 },
  nexia:  { w: 1.66, l: 4.26, wheel: 0.6, ax: 0.8, ride: 0.28, belt: 0.86, cabW: 1.5, glass: [-0.95, 0.8, 0.4], roof: [-0.95, 0.8], trunk: 0.04, lamp: 0.3, bump: 0.12 },
  chazor: { w: 1.72, l: 4.4, wheel: 0.64, ax: 0.82, ride: 0.3, belt: 0.92, cabW: 1.52, glass: [-0.9, 0.7, 0.48], roof: [-0.7, 0.45], trunk: 0.06, lamp: 0.46, bump: 0.2, cowl: true },
  bongo:  { w: 1.74, l: 5.1, wheel: 0.6 },
};

function makeCar(c, cargo = false) {
  const g = new THREE.Group();
  const body = own(c.hex), edge = new THREE.LineBasicMaterial({ color: T.line }), k = kit();
  const dark = new THREE.Color(c.hex).getHSL({}).l < 0.4, glass = dark ? DARK : GLASS;
  const bump = mat(shade(c.hex, dark ? 0.7 : 0.82)), lampF = mat(T.warnBg), lampR = mat(T.redTint);
  const s = SPEC[c.kind], { w, l, wheel } = s;
  // Колесо: графитовая шина + светлый диск, чуть утоплено под кузов
  const wheelAt = (x, z, sz = wheel) => {
    const sx = Math.sign(x);
    k(DARK, 0.26, sz, sz, x, 0, z);
    k(STEEL, 0.05, sz * 0.5, sz * 0.5, x + sx * 0.15, sz * 0.25, z);
  };
  let top, markZ = 0;
  if (c.kind === 'bongo') {
    // Cab-over: высокая плоская кабина без капота, низкая платформа с тремя бортами, задние колёса сдвоенные
    const cz = l / 2 - 0.8;
    k(body, w, 1.65, 1.6, 0, 0.5, cz, edge);
    k(body, w - 0.1, 0.12, 1.5, 0, 2.15, cz, edge);
    k(glass, w - 0.24, 0.72, 0.08, 0, 1.3, l / 2 + 0.01);
    for (const sx of [-1, 1]) { k(glass, 0.08, 0.6, 0.9, sx * (w / 2 + 0.01), 1.38, cz + 0.25); k(DARK, 0.08, 0.34, 0.18, sx * (w / 2 + 0.2), 1.45, l / 2 - 0.2); }
    k(DARK, w - 0.5, 0.25, l - 1.6, 0, 0.45, -0.8);
    const pl = l - 1.7, pz = -l / 2 + pl / 2;
    k(body, w, 0.12, pl, 0, 0.7, pz, edge);
    k(body, 0.07, 0.4, pl, w / 2 - 0.035, 0.82, pz, edge);
    k(body, 0.07, 0.4, pl, -w / 2 + 0.035, 0.82, pz, edge);
    k(body, w, 0.4, 0.07, 0, 0.82, -l / 2 + 0.035, edge);
    k(bump, w + 0.04, 0.24, 0.16, 0, 0.36, l / 2 + 0.02);
    k(WHITE, 0.5, 0.13, 0.04, 0, 0.42, l / 2 + 0.11);
    for (const sx of [-1, 1]) {
      k(lampF, 0.34, 0.2, 0.06, sx * (w / 2 - 0.3), 0.66, l / 2 + 0.02);
      k(lampR, 0.16, 0.12, 0.06, sx * (w / 2 - 0.12), 0.6, -l / 2 - 0.02);
      wheelAt(sx * (w / 2 - 0.15), l / 2 - 0.7);
      wheelAt(sx * (w / 2 - 0.15), -l / 2 + 1.05);
      wheelAt(sx * (w / 2 - 0.43), -l / 2 + 1.05);
    }
    if (cargo) for (const [x, z, y] of [[-0.4, -1.2, 0.82], [0.35, -1.2, 0.82], [-0.4, -1.2, 1.44], [0, -0.2, 0.82]]) crate(k, x, y, z);
    top = 2.27; markZ = cz;
  } else {
    const { ax, ride, belt, cabW, lamp } = s, wz = l / 2 - ax, wTop = wheel * 0.82;
    // Кузов из двух боксов: нижний короче (между арками), верхний во всю длину — колёса уходят в вырез
    k(body, w - 0.06, wTop - ride, 2 * wz - wheel - 0.2, 0, ride, 0, edge);
    k(body, w, belt - wTop, l - 0.3, 0, wTop, 0, edge);
    // Салон уже кузова: стекло + крыша (короче стекла — завал стоек)
    const [g0, g1, gh] = s.glass, [r0, r1] = s.roof;
    k(glass, cabW, gh, g1 - g0, 0, belt, (g0 + g1) / 2);
    k(body, cabW + 0.02, 0.1, r1 - r0, 0, belt + gh, (r0 + r1) / 2, edge);
    if (s.step) k(glass, cabW, s.step[2], s.step[1] - s.step[0], 0, belt, (s.step[0] + s.step[1]) / 2);   // задник ступенью
    if (s.trunk) { const t0 = -l / 2 + 0.15, t1 = g0 - 0.1; k(body, w - 0.1, s.trunk, t1 - t0, 0, belt, (t0 + t1) / 2, edge); }   // выраженный багажник
    if (s.cowl) k(body, cabW + 0.06, 0.12, 0.45, 0, belt, g1 + 0.22, edge);   // ступень капот → лобовое
    if (c.kind === 'lynk') {
      for (const sx of [-1, 1]) {
        k(DARK, 0.07, 0.07, r1 - r0 + 0.3, sx * (cabW / 2 - 0.1), belt + gh + 0.1, (r0 + r1) / 2);   // рейлинги
        for (const z of [-wz, wz]) k(DARK, 0.1, 0.22, wheel + 0.4, sx * (w / 2 + 0.03), wTop - 0.06, z);   // широкие арки
      }
      k(DARK, w - 0.3, 0.16, l - 2 * ax - wheel, 0, ride - 0.05, 0);
    }
    // Бампера темнее кузова, фары, фонари, зеркала, номер
    const by = ride + 0.02;
    k(bump, w + 0.02, s.bump, 0.16, 0, by, l / 2 - 0.1);
    k(bump, w + 0.02, s.bump, 0.16, 0, by, -l / 2 + 0.1);
    k(WHITE, 0.5, 0.12, 0.04, 0, by + 0.02, l / 2 + 0.0);
    for (const sx of [-1, 1]) {
      k(lampF, lamp, 0.15, 0.06, sx * (w / 2 - 0.32), belt - 0.25, l / 2 - 0.14);
      k(lampR, 0.3, 0.13, 0.06, sx * (w / 2 - 0.26), belt - 0.22, -l / 2 + 0.14);
      k(body, 0.16, 0.12, 0.2, sx * (cabW / 2 + 0.12), belt + 0.06, g1 - 0.25);
      wheelAt(sx * (w / 2 - 0.15), wz);
      wheelAt(sx * (w / 2 - 0.15), -wz);
    }
    top = belt + gh + 0.1; markZ = (r0 + r1) / 2;
  }
  k.into(g);
  // Красная полоска на крыше — метка выбора
  const mark = box(g, RED, w * 0.5, 0.06, 1, 0, top, markZ);
  mark.visible = false;
  g.userData = { mats: [body], edge, mark, top };
  return g;
}

/* ============== Фигурки ============== */
const CLOTH = [T.select, T.night3, T.line];
// Сотрудник ~1,6 м: ноги и руки на шарнирах (группа в бедре/плече), кейс — в правой руке
function makePerson(parent, x, z, rot, cloth, withCase) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  const cm = mat(cloth);
  const limb = (m, w, h, d, px, py) => {
    const p = new THREE.Group();
    p.position.set(px, py, 0);
    const me = new THREE.Mesh(BOX, m);
    me.scale.set(w, h, d);
    me.position.y = -h / 2;
    p.add(me);
    g.add(p);
    return p;
  };
  const legs = [limb(DARK, 0.2, 0.8, 0.22, -0.12, 0.8), limb(DARK, 0.2, 0.8, 0.22, 0.12, 0.8)];
  box(g, cm, 0.56, 0.6, 0.3, 0, 0.8, 0, EDGE);
  const arms = [limb(cm, 0.14, 0.6, 0.16, -0.36, 1.38), limb(cm, 0.14, 0.6, 0.16, 0.36, 1.38)];
  box(g, WHITE, 0.34, 0.34, 0.34, 0, 1.42, 0, EDGE);
  if (withCase) box(arms[1], DARK, 0.14, 0.36, 0.5, 0.06, -0.92, 0);
  g.userData = { legs, arms };
  parent.add(g);
  return g;
}
function pose(p, t) {
  const a = Math.sin(t * 9) * 0.5, { legs, arms } = p.userData;
  legs[0].rotation.x = a; legs[1].rotation.x = -a;
  arms[0].rotation.x = -a * 0.8; arms[1].rotation.x = a * 0.3;
}
// Точка на ломаной по пройденному пути: позиция + направление
function along(pts, d) {
  for (let i = 1; i < pts.length; i++) {
    const [ax, az] = pts[i - 1], [bx, bz] = pts[i], len = Math.hypot(bx - ax, bz - az);
    if (d <= len || i === pts.length - 1) { const k = Math.min(1, d / len); return [ax + (bx - ax) * k, az + (bz - az) * k, Math.atan2(bx - ax, bz - az), d >= len]; }
    d -= len;
  }
}
const pathLen = (pts) => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);

/* ============== Мир кампуса ============== */
function ground(parent, size) {
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(size, size), flat(T.bg));
  plane.rotation.x = -Math.PI / 2;
  parent.add(plane);
  // Сетка шагом 1 м: цвет --ink с низкой непрозрачностью, как --grid в токенах
  const grid = new THREE.GridHelper(size, size, T.ink, T.ink);
  grid.material.transparent = true;
  grid.material.opacity = 0.07;
  grid.material.depthWrite = false;
  grid.position.y = 0.06;
  parent.add(grid);
}

// Дорожки --line с бордюрами --ctl. Бордюр по стороне — с разрывами под примыкания.
function roads(k) {
  const ROAD = flat(T.line), CURB = mat(T.ctl);
  const rect = (x0, x1, z0, z1) => k(ROAD, x1 - x0, 0.04, z1 - z0, (x0 + x1) / 2, 0, (z0 + z1) / 2);
  const curbX = (z, x0, x1, gaps = []) => {   // бордюр вдоль x
    let a = x0;
    for (const [g0, g1] of [...gaps, [x1, x1]]) { if (g0 > a) k(CURB, g0 - a, 0.12, 0.16, (a + g0) / 2, 0, z); a = g1; }
  };
  const curbZ = (x, z0, z1, gaps = []) => {
    let a = z0;
    for (const [g0, g1] of [...gaps, [z1, z1]]) { if (g0 > a) k(CURB, 0.16, 0.12, g0 - a, x, 0, (a + g0) / 2); a = g1; }
  };
  rect(-34, 30, 16.5, 19.5);                       // главная дорога вдоль фронта
  curbX(16.5, -34, 30, [[-16.75, -14.75], [-9, -6], [-1, 1], [3, 21]]);
  curbX(19.5, -34, 30);
  rect(-9, -6, -10, 16.5);                         // поперечная к отелю
  curbZ(-9, 2.5, 16.5); curbZ(-6, -6, 16.5, [[-1, 1]]);
  rect(-28, -9, -10, 2.5);                         // площадь перед отелем
  curbZ(-28, -10, 2.5); curbX(2.5, -28, -9);
  rect(-16.75, -14.75, 13.5, 16.5);                // вход в офис
  curbZ(-16.75, 13.5, 16.5); curbZ(-14.75, 13.5, 16.5);
  rect(-1, 1, -6, 16.5);                           // от склада к дороге
  curbZ(-1, -6, 16.5); curbZ(1, -6, 16.5);
  // Фонари: стойка + куб-светильник
  for (const [x, z] of [[-29, 15.7], [-4, 15.7], [25, 15.7], [-9.7, 3.2]]) { k(DARK, 0.16, 3.6, 0.16, x, 0, z); k(DARK, 0.9, 0.1, 0.2, x + 0.35, 3.5, z); k(GLASS, 0.5, 0.4, 0.5, x + 0.7, 3.2, z, EDGE); }
  // Указатель на перекрёстке: столб и две стрелки-плашки
  k(DARK, 0.14, 3.2, 0.14, -9.8, 0, 15.7);
  k(WHITE, 1.6, 0.4, 0.08, -9.1, 2.5, 15.7, EDGE); k(RED, 0.2, 0.4, 0.1, -8.2, 2.5, 15.7);
  k(WHITE, 0.08, 0.4, 1.6, -9.8, 1.9, 15, EDGE); k(RED, 0.1, 0.4, 0.2, -9.8, 1.9, 14.1);
}

function buildCampus() {

  for (const s of SITES) labels[s.id] = label(roots[s.id], `<b>${s.title}</b><span>${s.sub}</span>`, 'tag', 0, roots[s.id].userData.top + 1.2, 0);

  const walkers = [

    .forEach(([x, z, r], i) => makePerson(g, x, z, r, CLOTH[(i + 1) % 3]));

  W.life = { van, walkers, crew };
  return g;
}

function buildGarageView() {

}

/* ============== 3D: мир, камера, цикл ============== */
function hasGL() {
  try { return !!(window.WebGL2RenderingContext && document.createElement('canvas').getContext('webgl2')); }
  catch { return false; }
}

// Камера по виду: направление (сверху-сбоку), цель, охват сцены в метрах — дистанция подбирается под аспект
const CAM = {
  campus: { dir: [0.6, 0.5, 0.64], target: [-3, 12, -1], span: [54, 60], min: 22, max: 220 },
  garage: { dir: [0.04, 0.46, 0.89], target: [0, 1.2, 0.5], span: [28, 9], min: 8, max: 70 },
};

function initWorld() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  sceneEl.appendChild(renderer.domElement);
  const css2d = new CSS2DRenderer();
  css2d.domElement.className = 'labels';
  sceneEl.appendChild(css2d.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(T.bg);
  // Свет: заливка + один направленный, теней нет — схема, а не «как в жизни»
  scene.add(new THREE.AmbientLight(0xffffff, 2));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(0.5, 1, 0.25);
  scene.add(sun);

  const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 600);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = !reduced;
  controls.dampingFactor = 0.08;
  controls.enablePan = true;
  controls.minPolarAngle = 0.25;          // не в зенит
  controls.maxPolarAngle = 1.38;          // не под землю
  controls.addEventListener('start', () => { state.userMoved = true; });

  W = { renderer, css2d, scene, camera, controls, elapsed: 0 };
  W.campus = buildCampus();
  W.garage = buildGarageView();
  scene.add(W.campus, W.garage);
  homeLife();

  // Кликабельное — только меши объектов; рёбра и земля в raycast не идут
  const collect = (ids, list) => ids.forEach((id) => roots[id].traverse((o) => { if (o.isMesh) { o.userData.root = id; list.push(o); } }));
  collect(['office', 'warehouse', 'garage', 'hotel', 'stage'], pickables.campus);
  collect(CARS.map((_, i) => 'car' + i), pickables.garage);

  new ResizeObserver(([e]) => {
    const { width, height } = e.contentRect;
    if (!width || !height) return;
    renderer.setSize(width, height);
    css2d.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    if (!state.userMoved) placeCamera();
  }).observe(sceneEl);

  bindPointer();
  const timer = new THREE.Timer();   // Clock в r186 устарел
  const bounds = new THREE.Vector3(), shift = new THREE.Vector3();
  renderer.setAnimationLoop((now) => {
    timer.update(now);
    const dt = Math.min(timer.getDelta(), 0.1);
    controls.update();
    // Сдвиг камеры не уводит цель за пределы сцены
    const t = controls.target;
    bounds.set(THREE.MathUtils.clamp(t.x, -40, 40), THREE.MathUtils.clamp(t.y, 0, 14), THREE.MathUtils.clamp(t.z, -40, 40));
    shift.subVectors(bounds, t);
    if (shift.lengthSq() > 0) { t.add(shift); camera.position.add(shift); }
    W.elapsed = timer.getElapsed();
    tickLife(W.elapsed, dt, now);
    renderer.render(scene, camera);
    css2d.render(scene, camera);
  });
}

function placeCamera() {
  if (!W) return;
  const c = CAM[state.view], { camera, controls } = W;
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(c.span[1] / 2 / tan, c.span[0] / 2 / (tan * camera.aspect)) * 1.12;
  const dir = new THREE.Vector3(...c.dir).normalize();
  controls.target.set(...c.target);
  camera.position.copy(controls.target).addScaledVector(dir, dist);
  controls.minDistance = c.min;
  controls.maxDistance = Math.max(c.max, dist * 1.3);
  controls.update();
}

/* ============== Жизнь кампуса: фургон, бригада, прохожие, появление сцены ============== */
// Маршрут Bongo: из проёма → дорога → поперечная → к сцене.
const HOME = [12 + bayX(VAN), 10.25];
// Обратно — разворот в три приёма: задом на площадь, вперёд на поперечную, домой, задом в проём.
const OUT = [HOME, [HOME[0], 18], [-7.5, 18], [-7.5, -2.2]];
const BACK = [[-7.5, -2.2], [-10.6, 1], [-7.5, 4.5], [-7.5, 18], [HOME[0], 18], HOME];
const OUT_LEN = pathLen(OUT), BACK_LEN = pathLen(BACK), LEG_FIRST = pathLen(BACK.slice(0, 2)), LEG_LAST = pathLen(BACK.slice(-2));
const CYCLE = 16, DRIVE = 6.5, STOP = 2;           // 6,5 с туда, 2 с у сцены, 6,5 с обратно, 1 с в гараже
let vanYaw = 0;
// cubic-bezier(.2,.8,.2,1) = --ease-out: x(s) решаем делением пополам
const bz = (s, a, b) => 3 * a * s * (1 - s) ** 2 + 3 * b * s * s * (1 - s) + s ** 3;
function easeOut(t) {
  let lo = 0, hi = 1, s = t;
  for (let i = 0; i < 18; i++) { s = (lo + hi) / 2; if (bz(s, 0.2, 0.2) < t) lo = s; else hi = s; }
  return bz(s, 0.8, 1);
}

function homeLife() {
  const { van, crew } = W.life;
  van.position.set(HOME[0], 0, HOME[1]);
  van.rotation.y = vanYaw = 0;
  crew.forEach((c) => { c.p.position.set(c.home[0], 0, c.home[1]); c.p.rotation.y = 0.3; pose(c.p, 0); });
}

function tickLife(time, dt, now) {
  const { van, walkers, crew } = W.life;
  // Сцена растёт из земли за 400 мс (--ease-out); при reduced motion — сразу
  if (W.pop) {
    const k = reduced ? 1 : Math.min(1, (now - W.pop.t0) / 400), e = easeOut(k), s = W.pop.on ? e : 1 - e;
    roots.stage.scale.setScalar(Math.max(s, 0.001));
    roots.stage.visible = s > 0.001;
    if (k >= 1) W.pop = null;
  }
  // Прохожие ходят туда-обратно всегда
  for (const w of walkers) {
    if (reduced) break;
    const L = pathLen(w.pts), d = ((time * 1.3 + w.ph) % (2 * L));
    const [x, z, yaw] = d < L ? along(w.pts, d) : along(w.pts.slice().reverse(), d - L);
    w.p.position.set(x, 0, z); w.p.rotation.y = yaw; pose(w.p, time + w.ph);
  }
  if (!state.event) return;
  const t = time - W.evT0;
  // Бригада идёт к сцене с кейсами и остаётся
  crew.forEach((c, i) => {
    const d = reduced ? 1e3 : Math.max(0, t - i * 0.4) * 4;
    const [x, z, yaw, done] = along(c.pts, d);
    c.p.position.set(x, 0, z);
    c.p.rotation.y = done ? Math.PI : yaw;
    pose(c.p, done ? 0 : time);
  });
  // Фургон
  let pos, rev = false;
  if (reduced) pos = [OUT.at(-1)[0], OUT.at(-1)[1], Math.PI];
  else {
    const c = t % CYCLE;
    if (c < DRIVE) pos = along(OUT, (c / DRIVE) * OUT_LEN);
    else if (c < DRIVE + STOP) pos = along(OUT, OUT_LEN);
    else if (c < 2 * DRIVE + STOP) {
      const d = ((c - DRIVE - STOP) / DRIVE) * BACK_LEN;
      pos = along(BACK, d);
      // задом: первый отрезок (от сцены) и последний (в проём)
      rev = d < LEG_FIRST || d > BACK_LEN - LEG_LAST;
    } else pos = [HOME[0], HOME[1], 0];
  }
  const [x, z, dir] = pos;
  van.position.set(x, 0, z);
  const want = rev ? dir + Math.PI : dir;
  let d = Math.atan2(Math.sin(want - vanYaw), Math.cos(want - vanYaw));   // кратчайший поворот
  vanYaw += reduced ? d : d * Math.min(1, dt * 7);
  van.rotation.y = vanYaw;
}

/* ============== Наведение, выбор, клавиатура ============== */
const ndc = new THREE.Vector2(), ray = new THREE.Raycaster();
function pickAt(ev) {
  const r = W.renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, W.camera);
  // raycast не смотрит на visible: сцену без мероприятия отсекаем руками
  const hit = ray.intersectObjects(pickables[state.view], false).find((h) => h.object.userData.root !== 'stage' || state.event);
  return hit ? hit.object.userData.root : null;
}
function bindPointer() {
  const el = W.renderer.domElement;
  let down = null;
  el.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' && !e.buttons) setHover(pickAt(e)); });
  el.addEventListener('pointerleave', () => setHover(null));
  el.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
  el.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;   // это был поворот, не клик
    const id = pickAt(e);
    if (id) activate(id);
    else if (state.view === 'garage') select(null);
  });
}

function nameOf(id) {
  if (id.startsWith('car')) { const c = CARS[+id.slice(3)]; return `${c.brand} ${c.model} · ${c.plate}`; }
  return NAMES[id];
}

function paint(id) {
  const r = roots[id];
  if (!r) return;
  const hot = state.hover === id;
  r.userData.mats.forEach((m) => m.emissive.set(hot ? 0x5a5a5a : 0x000000));
  r.userData.edge.color.set(hot ? T.ink : T.line);
  const sel = id === 'car' + state.sel;
  if (r.userData.mark) r.userData.mark.visible = sel;
  const el = labels[id]?.element;
  if (el) { el.classList.toggle('is-hot', hot); el.classList.toggle('is-sel', sel); }
}

function setHover(id) {
  if (state.hover === id) return;
  const prev = state.hover;
  state.hover = id;
  if (prev) paint(prev);
  if (id) paint(id);
  sceneEl.classList.toggle('is-pick', !!id);
  if (id) $('hoverLive').textContent = nameOf(id);
}

let toastTimer;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('is-on'), 2400);
}

function activate(id) {
  if (id.startsWith('car')) return select(+id.slice(3));
  if (id === 'garage') return setView('garage', true);
  toast(`${nameOf(id)} — в макете с47 не раскрыт`);
}

function select(i) {
  const prev = state.sel;
  state.sel = i;
  if (prev != null) paint('car' + prev);
  if (i != null) paint('car' + i);
  dock.querySelectorAll('[data-id]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === 'car' + i)));
  renderPanel();
}

/* ============== Панель гаража ============== */
const plateHTML = (p) => { const [r, ...rest] = p.split(' '); return `<span class="plate plate--lg" aria-label="Госномер ${p}"><b>${r}</b><span>${rest.join(' ')}</span><i>UZ</i></span>`; };
function renderPanel() {
  if (state.sel == null) {
    panel.innerHTML = `<div class="p-empty"><span class="p-photo"><svg class="i"><use href="#i-car"/></svg></span>
      <h3>Выберите машину в гараже</h3><p>или клавишами <kbd>Tab</kbd> / стрелками <kbd>←</kbd> <kbd>→</kbd></p></div>`;
    return;
  }
  const c = CARS[state.sel];
  panel.innerHTML = `<div class="p-head"><span class="p-photo"><svg class="i"><use href="#i-car"/></svg></span>
      <div><h2 class="p-name" id="panelTitle">${c.brand} ${c.model}</h2><p class="p-role">Машина · гараж ARGO</p>
      <div class="p-plate">${plateHTML(c.plate)}</div></div></div>
    <div class="p-body"><h4>Данные</h4><dl>
      <div class="kv"><dt>Цвет</dt><dd><span class="sw" style="background:${c.hex}"></span>${c.color}</dd></div>
      <div class="kv"><dt>Госномер</dt><dd class="m">${c.plate}</dd></div>
      <div class="kv"><dt>Водитель</dt><dd class="q">не назначен</dd></div>
      <div class="kv"><dt>Файлы</dt><dd class="q">нет</dd></div></dl></div>
    <div class="p-foot"><button type="button" class="btn btn--ink" data-stub="Карточка">Открыть карточку</button>
      <button type="button" class="btn btn--secondary" data-stub="Экспорт"><svg class="i"><use href="#i-sheet"/></svg>Экспорт</button></div>`;
}
panel.addEventListener('click', (e) => { const b = e.target.closest('[data-stub]'); if (b) toast(`${b.dataset.stub} — в макете не подключено`); });

/* ============== Вкладки, тумблер, нижняя панель ============== */
function renderDock() {
  const items = state.view === 'garage'
    ? CARS.map((c, i) => `<button type="button" class="chip chip--plate" data-id="car${i}" aria-pressed="${state.sel === i}" aria-label="${c.brand} ${c.model}, госномер ${c.plate}">${c.plate}</button>`)
    : [...SITES.map((s) => s.id), ...(state.event ? ['stage'] : [])].map((id) => `<button type="button" class="chip" data-id="${id}">${NAMES[id]}</button>`);
  dock.innerHTML = items.join('');
}
// Фокус кнопки = подсветка объекта в 3D, Enter/клик = выбор
dock.addEventListener('focusin', (e) => { const b = e.target.closest('[data-id]'); if (b) setHover(b.dataset.id); });
dock.addEventListener('focusout', () => setHover(null));
dock.addEventListener('mouseover', (e) => { const b = e.target.closest('[data-id]'); if (b) setHover(b.dataset.id); });
dock.addEventListener('mouseleave', () => { if (!dock.contains(document.activeElement)) setHover(null); });
dock.addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) activate(b.dataset.id); });

function renderCap() {
  const c = CAPS[state.view === 'garage' ? 'garage' : state.event ? 'event' : 'campus'];
  $('cap').innerHTML = `<b>${c[0]}</b><span>${c[1]}</span>`;
}

// Мероприятие сегодня: слой поверх кампуса, а не отдельный вид
function setEvent(on) {
  state.event = on;
  evSwitch.setAttribute('aria-checked', String(on));
  $('today').hidden = !on;
  if (state.hover === 'stage') setHover(null);
  renderCap();
  if (state.view === 'campus') renderDock();
  if (!W) return;
  for (const s of SITES) if (s.ev) labels[s.id].element.querySelector('span').textContent = on ? s.ev : s.sub;
  labels.hotel.visible = !on;
  labels.event.visible = on;
  W.pop = { on, t0: performance.now() };
  if (on) { roots.stage.visible = true; W.evT0 = W.elapsed; }
  if (!on) homeLife();
}
evSwitch.addEventListener('click', () => setEvent(!state.event));

const tabs = [...document.querySelectorAll('[role="tab"]')];
function setView(view, focusTab) {
  state.view = view;
  setHover(null);
  tabs.forEach((t) => {
    const on = t.dataset.view === view;
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
    if (on && focusTab) t.focus();
  });
  stageEl.setAttribute('aria-labelledby', 'tab-' + view);
  app.classList.toggle('is-garage', view === 'garage');
  panel.hidden = view !== 'garage';
  evSwitch.hidden = view === 'garage';
  renderCap();
  renderDock();
  renderPanel();
  if (W) {
    W.campus.visible = view === 'campus';
    W.garage.visible = view === 'garage';
    state.userMoved = false;
    placeCamera();
  }
}
tabs.forEach((t, i) => {
  t.addEventListener('click', () => setView(t.dataset.view));
  t.addEventListener('keydown', (e) => {
    const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (d) { e.preventDefault(); setView(tabs[(i + d + tabs.length) % tabs.length].dataset.view, true); }
  });
});
// Стрелки при фокусе в сцене гаража листают машины; Esc снимает выбор
sceneEl.addEventListener('keydown', (e) => {
  if (state.view !== 'garage') return;
  const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (d) {
    e.preventDefault();
    select(state.sel == null ? (d > 0 ? 0 : CARS.length - 1) : (state.sel + d + CARS.length) % CARS.length);
    $('hoverLive').textContent = nameOf('car' + state.sel);
  } else if (e.key === 'Escape') select(null);
});

if (hasGL()) initWorld();
if (location.hash === '#debug') window.__world = W;   // для проверок: число мешей, позиция фургона
else sceneEl.innerHTML = '<p class="fallback">3D недоступно — объекты доступны кнопками внизу</p>';
setView('campus');
</script>
</body>
</html>
