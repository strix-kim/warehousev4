<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUD воксельного мира — направление B «Знаки»</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Manrope:wght@600;700;800&subset=cyrillic,latin&display=swap">
<script>
/* Единственный JS страницы: ?frame=d | ?frame=p оставляет одну рамку без подписей
   и отступов — так страница сравнения вставляет направление в iframe. */
(function () {
  var f = new URLSearchParams(location.search).get('frame');
  if (f === 'd' || f === 'p') document.documentElement.setAttribute('data-frame', f);
})();
</script>
<style>
/* =========================================================
   0. Токены — дословно из src/react/styles/01-tokens.css.
   ========================================================= */
:root {
  color-scheme: light;
  font-family: var(--f-text);
  color: var(--ink);
  background: var(--bg);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  --f-display: "Manrope","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text: "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono: "JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg: #EEF0F3;
  --grid: rgba(22,24,29,.055);
  --card: #FFFFFF;
  --sunk: #F5F6F8;
  --hover: #F0F2F5;
  --select: #E9ECF1;
  --ink: #16181D;
  --ink-2: #2A2E36;
  --muted: #5F6470;
  --faint: #676C77;
  --soft: #8A8F9A;
  --line: #DDE0E5;
  --line-2: #E8EAEE;
  --ctl: #858A95;
  --red: #E52D27;
  --red-act: #C8201B;
  --red-press: #AE1B16;
  --red-tint: #FCEAE9;
  --night: #0F1115;
  --night-2: #1A1D23;
  --night-3: #262A31;
  --night-line: #2C3038;
  --on-night: #E8EAEE;
  --on-night-2: #9CA1AC;
  --red-night: #FF5A52;
  --bad-night: #FF8095;
  --neutral-night: #D5D8DE;
  --warn-night: #F2B544;
  --ok: #1B7A45;
  --ok-bg: #E3F3EA;
  --ok-dot: #2A9D5C;
  --warn: #8A5A00;
  --warn-bg: #FBF0D5;
  --warn-dot: #B7800A;
  --bad: #B0203F;
  --bad-bg: #FBE6EA;
  --bad-dot: #B0203F;
  --focus: #16181D;
  --r-xl: 22px;
  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 8px;
  --ease-out: cubic-bezier(.2,.8,.2,1);
  --shadow-pop: 0 18px 48px rgba(15,17,21,.16), 0 2px 6px rgba(15,17,21,.06);
  --shadow-drawer: -24px 0 60px rgba(15,17,21,.18);
  --shadow-card: 0 12px 32px rgba(15, 17, 21, 0.07);
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; }
button { margin: 0; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
/* Фокус: тёмная обводка на светлой сцене; внутри тёмной плашки — белая. */
:focus-visible, .is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
.route :focus-visible { outline-color: var(--card); }

/* =========================================================
   1. Страница и рамки (каркас общий для трёх направлений).
   ========================================================= */
.page { display: grid; justify-items: start; gap: 12px; padding: 24px; }
.page__title { margin: 0; font: 800 20px/24px var(--f-display); letter-spacing: -.02em; }
.page__cap { margin: 12px 0 0; color: var(--muted); font: 500 13px/16px var(--f-text); }
.frame { position: relative; overflow: hidden; border-radius: var(--r-lg); }
.frame-d { width: 1376px; height: 687px; background: var(--bg) url(voxel-hud-s48-bg-1440.png) 0 0 / 1376px 687px no-repeat; }
.frame-p { width: 390px; height: 560px; background: var(--bg) url(voxel-hud-s48-bg-390.png) 0 60px / 390px auto no-repeat; }
html[data-frame] .page { display: block; padding: 0; }
html[data-frame] .page__title, html[data-frame] .page__cap { display: none; }
html[data-frame="d"] .frame-p, html[data-frame="p"] .frame-d { display: none; }

/* =========================================================
   2. Общий материал знака: матовая тёмная плашка с кантом.
   Кант — тонкая рамка в 3 px от края, как у дорожного знака.
   ========================================================= */
.plaque { position: relative; border-radius: var(--r-sm); color: var(--on-night); background: var(--night); box-shadow: var(--shadow-card); }
.plaque::before { content: ''; position: absolute; inset: 3px; border: 1px solid var(--on-night-2); border-radius: calc(var(--r-sm) - 3px); pointer-events: none; transition: border-color .16s var(--ease-out); }
/* Табло-ячейка: число (и единица под ним) на отдельной подложке. */
.cell { align-self: stretch; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 44px; padding: 0 8px; border-radius: calc(var(--r-sm) - 5px); background: var(--night-3); transition: background-color .16s var(--ease-out); }
.cell__num { font: 800 26px/26px var(--f-display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--on-night); }
.cell__unit { font: 500 13px/14px var(--f-text); white-space: nowrap; color: var(--on-night-2); }
/* Статус «идёт»: точка + слово, не только цвет. */
.live { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ok-dot); white-space: nowrap; }
.live::before { content: ''; width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--ok-dot); }
/* Флажок указателя из сцены: тёмный столбик, красное полотнище. */
.flag { position: relative; flex: none; width: 16px; height: 28px; }
.flag::before { content: ''; position: absolute; left: 0; top: 0; width: 3px; height: 100%; background: var(--on-night); }
.flag::after { content: ''; position: absolute; left: 3px; top: 1px; width: 12px; height: 9px; background: var(--red); }

/* =========================================================
   3. T — вывеска на ножке. Точка .sign стоит в якоре (--x, --y),
   плашка шириной --w висит над ней на ножке --leg; --shift сдвигает
   плашку от центра, ножка остаётся в якоре.
   ========================================================= */
.sign { position: absolute; left: var(--x); top: var(--y); width: 0; height: 0; --leg: 12px; --h: 56px; --shift: 0px; }
.sign__leg { position: absolute; left: -1px; bottom: 0; width: 3px; height: calc(var(--leg) + 2px); background: var(--night-3); }
.sign__board { position: absolute; z-index: 1; left: calc(var(--w) / -2 + var(--shift)); bottom: var(--leg); width: var(--w); height: var(--h); display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; transition: transform .16s var(--ease-out), box-shadow .16s var(--ease-out); }
.sign__text { min-width: 0; display: grid; }
.sign__name { font: 700 15px/18px var(--f-display); white-space: nowrap; color: var(--on-night); }
.sign__sub { font: 500 13px/16px var(--f-text); white-space: nowrap; color: var(--on-night-2); }
/* Наведение: кант белеет, плашка приподнимается на 2 px. */
.sign__board:hover, .sign.is-hover .sign__board { transform: translateY(-2px); box-shadow: var(--shadow-pop); }
.sign__board:hover::before, .sign.is-hover .sign__board::before { border-color: var(--card); }
/* Выбор: ячейка-табло красная, как табло на фасадах; ножка красная. */
.sign.is-selected .cell { background: var(--red-act); }
.sign.is-selected .cell__num, .sign.is-selected .cell__unit { color: var(--card); }
.sign.is-selected .sign__leg { background: var(--red); }
/* Телефон: имя + одно число. */
.sign--sm { --leg: 10px; --h: 44px; }
.sign--sm .sign__board { gap: 7px; padding: 5px 9px 5px 5px; }
.sign--sm .cell { min-width: 24px; padding: 0 5px; }
.sign--sm .cell__num { font-size: 18px; line-height: 20px; }
.sign--sm .sign__name { font-size: 14px; }

/* =========================================================
   4. C — табло дня.
   ========================================================= */
.day { position: absolute; left: 16px; top: 16px; width: 360px; height: 56px; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; }
.day__date { flex: 1; min-width: 0; font: 700 16px/20px var(--f-display); white-space: nowrap; }
.day__cell { flex-direction: row; align-items: baseline; gap: 6px; padding: 0 10px; }
.day__cell .cell__num { font-size: 22px; line-height: 44px; }
.day__cell .cell__unit { line-height: 44px; }
/* Телефон: свёрнута, итог события одной строкой. */
.day--sm { left: 16px; top: 8px; width: 358px; height: 48px; gap: 8px; padding: 6px 14px 6px 12px; text-align: left; }
.day--sm .flag { height: 24px; }
.day__line { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0; font: 600 14px/18px var(--f-text); white-space: nowrap; }
.day__line .sep { padding: 0 4px; color: var(--on-night-2); }
.day__chev { flex: none; width: 8px; height: 8px; margin: 0 2px 4px 0; border-right: 2px solid var(--on-night-2); border-bottom: 2px solid var(--on-night-2); transform: rotate(45deg); }

/* =========================================================
   5. Карточка события — дорожный указатель направления «→ выезд».
   ========================================================= */
.route { position: absolute; right: 16px; bottom: 16px; width: 360px; height: 240px; display: flex; flex-direction: column; padding: 16px; box-shadow: var(--shadow-pop); }
/* Стойка к столбику выезда (763, 551): карточка начинается с x = 1000, y = 431. */
.route__arm { position: absolute; left: -237px; top: 119px; width: 237px; height: 3px; background: var(--night-3); }
.route__arm::before { content: ''; position: absolute; left: -3px; top: -2px; width: 7px; height: 7px; background: var(--night-3); }
.route__head { display: flex; align-items: center; gap: 10px; height: 24px; margin-bottom: 10px; }
.arrow { position: relative; flex: none; width: 30px; height: 18px; }
.arrow::before { content: ''; position: absolute; left: 0; top: 6px; width: 18px; height: 6px; background: var(--on-night); }
.arrow::after { content: ''; position: absolute; left: 17px; top: 0; border-left: 13px solid var(--on-night); border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
.route__kicker { font: 600 13px/16px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--on-night-2); }
.route__title { margin: 0 0 4px; font: 800 22px/26px var(--f-display); letter-spacing: -.02em; color: var(--card); white-space: nowrap; }
/* Площадка: место под две строки держим всегда, обрезки нет. */
.route__venue { margin: 0 0 8px; min-height: 40px; font: 500 15px/20px var(--f-text); color: var(--on-night); text-wrap: balance; }
.route__status { margin: 0 0 2px; font: 600 13px/16px var(--f-text); }
.route__meta { margin: 0; font: 500 13px/16px var(--f-text); color: var(--on-night-2); white-space: nowrap; }
.route__open { margin-top: auto; width: 100%; height: 44px; display: grid; place-items: center; border-radius: calc(var(--r-sm) - 3px); color: var(--ink); background: var(--card); font: 700 15px/20px var(--f-display); transition: background-color .16s var(--ease-out); }
.route__open:hover { background: var(--line-2); }

/* Телефон: у выезда — компактная метка события, не карточка. */
.tag { position: absolute; left: var(--x); top: var(--y); width: 0; height: 0; }
.tag__leg { position: absolute; left: -1px; bottom: 0; width: 3px; height: 10px; background: var(--night-3); }
.tag__board { position: absolute; z-index: 1; left: -20px; bottom: 8px; width: 160px; height: 44px; display: grid; align-content: center; padding: 0 9px 0 11px; }
.tag__name { font: 700 13px/15px var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--card); }
.tag__sub { display: flex; align-items: center; font: 500 13px/15px var(--f-text); white-space: nowrap; color: var(--on-night-2); }
.tag__sub .live::before { width: 7px; height: 7px; }
.tag__sub .live { gap: 5px; }

/* =========================================================
   6. A — клавиши: четыре отдельные плашки, зазор 8.
   ========================================================= */
.keys { position: absolute; left: 16px; bottom: 16px; width: 600px; height: 80px; display: flex; align-items: flex-end; gap: 8px; }
.key { flex: 1; height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 10px; font: 700 15px/20px var(--f-display); }
.key:hover::before { border-color: var(--card); }
/* Выбранная клавиша: красная полоса по низу, внутри канта. */
.key.is-selected::after { content: ''; position: absolute; left: 6px; right: 6px; bottom: 6px; height: 4px; border-radius: 1px; background: var(--red); }
.key.is-selected .ico { margin-bottom: 4px; }
.key.is-selected .key__name { margin-bottom: 4px; }
/* Телефон: цели 56×56, только значок (имя — в aria-label). */
.keys--sm { left: auto; right: 16px; width: 248px; height: 64px; }
.keys--sm .key { flex: none; width: 56px; padding: 0; }
.keys--sm .ico { transform: scale(1.2); }

/* Значки-объекты из CSS-кубиков, поле 24×20. */
.ico { position: relative; flex: none; width: 24px; height: 20px; }
.ico i { position: absolute; background: var(--on-night); }
/* Офис: кубик и флагшток с красным флажком. */
.ico--office i:nth-child(1) { left: 0; bottom: 0; width: 13px; height: 13px; }
.ico--office i:nth-child(2) { left: 16px; bottom: 0; width: 2px; height: 20px; background: var(--on-night-2); }
.ico--office i:nth-child(3) { left: 18px; top: 1px; width: 6px; height: 5px; background: var(--red-night); }
/* Склад: длинный низкий блок, ступень и башня. */
.ico--store i:nth-child(1) { left: 0; bottom: 0; width: 16px; height: 8px; }
.ico--store i:nth-child(2) { left: 3px; bottom: 8px; width: 10px; height: 4px; background: var(--on-night-2); }
.ico--store i:nth-child(3) { left: 17px; bottom: 0; width: 7px; height: 16px; }
/* Гараж: блок с двумя воротами (ворота — цвет плашки). */
.ico--garage i:nth-child(1) { left: 0; bottom: 0; width: 24px; height: 13px; }
.ico--garage i:nth-child(2) { left: 4px; bottom: 0; width: 7px; height: 8px; background: var(--night); }
.ico--garage i:nth-child(3) { left: 13px; bottom: 0; width: 7px; height: 8px; background: var(--night); }
/* Списком: три полоски. */
.ico--list i { left: 2px; width: 20px; height: 3px; }
.ico--list i:nth-child(1) { top: 2px; }
.ico--list i:nth-child(2) { top: 9px; }
.ico--list i:nth-child(3) { top: 16px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<main class="page">
  <h1 class="page__title">Направление B — «Знаки»</h1>
  <p class="page__cap">Десктоп, 1376×687. Склад — наведение, гараж — выбран, клавиша «Офис» — клавиатурный фокус.</p>

  <!-- ================= Десктоп ================= -->
  <section class="frame frame-d" aria-label="Кампус, десктоп">
    <!-- C: табло дня -->
    <div class="plaque day">
      <span class="flag" aria-hidden="true"></span>
      <span class="day__date">Сегодня, 7 октября</span>
      <span class="cell day__cell"><b class="cell__num">1</b><span class="cell__unit">мероприятие</span></span>
    </div>

    <!-- T: вывески на ножке. Гараж — выбран, склад — наведение, офис — покой. -->
    <div class="sign is-selected" style="--x:346px;--y:150px;--w:140px">
      <span class="sign__leg"></span>
      <button class="plaque sign__board" type="button" aria-pressed="true">
        <span class="cell"><b class="cell__num">6</b><span class="cell__unit">машин</span></span>
        <span class="sign__text"><span class="sign__name">Гараж</span><span class="sign__sub">1 в пути</span></span>
      </button>
    </div>
    <div class="sign" style="--x:700px;--y:148px;--w:148px">
      <span class="sign__leg"></span>
      <button class="plaque sign__board" type="button">
        <span class="cell"><b class="cell__num">6</b><span class="cell__unit">списков</span></span>
        <span class="sign__text"><span class="sign__name">Офис</span><span class="sign__sub">Списки</span></span>
      </button>
    </div>
    <div class="sign is-hover" style="--x:1052px;--y:103px;--w:196px">
      <span class="sign__leg"></span>
      <button class="plaque sign__board" type="button">
        <span class="cell"><b class="cell__num">1&nbsp;867</b><span class="cell__unit">единиц</span></span>
        <span class="sign__text"><span class="sign__name">Склад</span><span class="sign__sub">86 на выезде</span></span>
      </button>
    </div>

    <!-- Карточка события: указатель направления, раскрыта -->
    <article class="plaque route">
      <span class="route__arm" aria-hidden="true"></span>
      <div class="route__head"><span class="arrow" aria-hidden="true"></span><span class="route__kicker">Выезд</span></div>
      <h2 class="route__title">Bionorica Workshop</h2>
      <p class="route__venue">Hyatt Regency Tashkent · Grand Ballroom A+B</p>
      <p class="route__status"><span class="live">идёт</span></p>
      <p class="route__meta">32 позиции · залы Jupiter &amp; Uranus</p>
      <button class="route__open" type="button">Открыть список</button>
    </article>

    <!-- A: клавиши -->
    <nav class="keys" aria-label="Разделы">
      <button class="plaque key is-focus" type="button"><span class="ico ico--office" aria-hidden="true"><i></i><i></i><i></i></span><span class="key__name">Офис</span></button>
      <button class="plaque key" type="button"><span class="ico ico--store" aria-hidden="true"><i></i><i></i><i></i></span><span class="key__name">Склад</span></button>
      <button class="plaque key is-selected" type="button" aria-pressed="true"><span class="ico ico--garage" aria-hidden="true"><i></i><i></i><i></i></span><span class="key__name">Гараж</span></button>
      <button class="plaque key" type="button"><span class="ico ico--list" aria-hidden="true"><i></i><i></i><i></i></span><span class="key__name">Списком</span></button>
    </nav>
  </section>

  <p class="page__cap">Телефон, 390×560. Те же состояния.</p>

  <!-- ================= Телефон ================= -->
  <section class="frame frame-p" aria-label="Кампус, телефон">
    <!-- C: свёрнута, итог события одной строкой -->
    <button class="plaque day day--sm" type="button" aria-expanded="false">
      <span class="flag" aria-hidden="true"></span>
      <span class="day__line">Сегодня<span class="sep">·</span>Bionorica Workshop<span class="sep">·</span><span class="live">идёт</span></span>
      <span class="day__chev" aria-hidden="true"></span>
    </button>

    <!-- T: имя + одно число -->
    <div class="sign sign--sm is-selected" style="--x:70px;--y:207px;--w:90px">
      <span class="sign__leg"></span>
      <button class="plaque sign__board" type="button" aria-pressed="true">
        <span class="cell"><b class="cell__num">6</b></span>
        <span class="sign__text"><span class="sign__name">Гараж</span></span>
      </button>
    </div>
    <div class="sign sign--sm" style="--x:198px;--y:207px;--w:84px">
      <span class="sign__leg"></span>
      <button class="plaque sign__board" type="button">
        <span class="cell"><b class="cell__num">6</b></span>
        <span class="sign__text"><span class="sign__name">Офис</span></span>
      </button>
    </div>
    <!-- Склад у правого края: плашка сдвинута влево на 12 (правый край 374), ножка в якоре -->
    <div class="sign sign--sm is-hover" style="--x:326px;--y:190px;--w:120px;--shift:-12px">
      <span class="sign__leg"></span>
      <button class="plaque sign__board" type="button">
        <span class="cell"><b class="cell__num">1&nbsp;867</b></span>
        <span class="sign__text"><span class="sign__name">Склад</span></span>
      </button>
    </div>

    <!-- Метка события у выезда -->
    <div class="tag" style="--x:216px;--y:333px">
      <span class="tag__leg"></span>
      <button class="plaque tag__board" type="button">
        <span class="tag__name">Bionorica Workshop</span>
        <span class="tag__sub"><span class="live">идёт</span>&nbsp;· 32 позиции</span>
      </button>
    </div>

    <!-- A: четыре цели 56×56 -->
    <nav class="keys keys--sm" aria-label="Разделы">
