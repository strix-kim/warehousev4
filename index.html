<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F1115" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <!-- Соединение с Supabase поднимаем заранее: DNS, TLS и HTTP/2 первого запроса
         иначе считаются уже ПОСЛЕ того, как загрузился и выполнился бандл. Адрес
         подставляет Vite из той же переменной, что читает клиент (%VITE_*% в
         index.html — штатная подстановка), поэтому второго источника правды нет. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- Предзагрузки иллюстрации здесь больше нет: тег в index.html висит на ВСЕХ
         адресах, а картинка нужна двум — входу и главной. Остальные четыре раздела
         платили за неё 69 КБ и получали от Chromium «preloaded but not used».
         Обе страницы, которым она нужна, грузят её сами: loading="eager" плюс
         fetchPriority="high" на самом <img>. -->
    <!-- Предзагружаем ровно два шрифта — Inter latin и Inter cyrillic: основной
         текст на ВСЕХ адресах, без предзагрузки браузер узнаёт о них только после
         разбора CSS. latin нужен и русскому интерфейсу — цифры, пробелы и
         пунктуация лежат в нём. Manrope (заголовки), Mono (коды) и cyrillic-ext
         грузятся по требованию: не на каждой странице они есть. Путь — исходник;
         Vite при сборке переписывает его на тот же хэшированный файл, что в CSS. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/react/assets/fonts/inter-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/react/assets/fonts/inter-cyrillic-wght-normal.woff2" />
    <title>ARGO · Учёт оборудования</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react/main.tsx"></script>
  </body>
</html>
